name: Build and Release WAR

on:
  push:
    branches:
      - main
      - overhaul

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    services:
      mysql:
        image: mysql:8.4.2
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: root
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be ready..."
          until mysqladmin ping -h 127.0.0.1 --silent; do
            sleep 3
          done
          echo "MySQL is ready."

      - name: Build with Maven
        run: mvn -B -ntp clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/root
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: password

      - name: Upload WAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-artifact
          path: billsoft/target/*.war
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: war-artifact
          path: ./dist

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload WAR to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/$(ls dist | grep ".war")
          asset_name: billsoft.war
          asset_content_type: application/java-archive
