name: Cleanup Old Action Runs and Artifacts

on:
  workflow_dispatch:
    inputs:
      delete_artifacts_only:
        description: 'Delete only stored artifacts (keep workflow run logs)'
        type: boolean
        required: true
        default: false

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Purge Stored Artifacts & Runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete Accumulated Artifacts
        shell: bash
        run: |
          echo "=== Purging Stored Artifacts to Reclaim Storage Quota ==="
          TOTAL_DELETED=0
          while true; do
            RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100")
            
            IDS=$(echo "$RESPONSE" | jq -r '.artifacts[]?.id // empty')
            if [ -z "$IDS" ]; then
              echo "✓ No more artifacts found."
              break
            fi
            
            COUNT=$(echo "$IDS" | wc -l)
            echo "Deleting batch of $COUNT artifacts..."
            for id in $IDS; do
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id"
              TOTAL_DELETED=$((TOTAL_DELETED + 1))
            done
          done
          echo "Successfully deleted $TOTAL_DELETED artifacts."

      - name: Delete Old Workflow Runs
        if: ${{ !inputs.delete_artifacts_only }}
        shell: bash
        run: |
          echo "=== Purging Old Workflow Runs ==="
          CURRENT_RUN_ID="${{ github.run_id }}"
          TOTAL_RUNS_DELETED=0
          
          while true; do
            RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
            
            IDS=$(echo "$RESPONSE" | jq -r --arg cur "$CURRENT_RUN_ID" '.workflow_runs[]? | select((.id|tostring) != $cur) | .id')
            if [ -z "$IDS" ]; then
              echo "✓ No more workflow runs found to delete."
              break
            fi
            
            COUNT=$(echo "$IDS" | wc -l)
            echo "Deleting batch of $COUNT workflow runs..."
            for id in $IDS; do
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$id"
              TOTAL_RUNS_DELETED=$((TOTAL_RUNS_DELETED + 1))
            done
          done
          echo "Successfully deleted $TOTAL_RUNS_DELETED workflow runs."
