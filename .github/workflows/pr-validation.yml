name: Production PR Validation

on:
  pull_request:
    branches:
      - PROD
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  validate-backend:
    name: Backend Tests and Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Backend Maven Tests
        run: mvn clean test --batch-mode

      - name: Verify Application Packaging
        run: mvn clean package -DskipTests --batch-mode

  validate-desktop:
    name: Electron and Desktop Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Desktop Dependencies & Verify Electron Configuration
        working-directory: desktop/electron
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          node test/verify-electron-config.js

