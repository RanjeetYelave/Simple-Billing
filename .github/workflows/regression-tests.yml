name: CI Regression & UI Tests

on:
  push:
    branches:
      - main
      - OTA_update
      - Release-branch
      - overhaul
  pull_request:
    branches:
      - main
      - OTA_update
      - Release-branch
      - overhaul
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  regression-tests:
    name: Backend & UI Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui-regression/package-lock.json

      - name: Build and Run Backend Maven Tests (Unit, Integration, Regression, E2E)
        run: |
          mvn clean test --batch-mode

      - name: Generate JaCoCo Coverage Report
        if: always()
        run: |
          mvn jacoco:report --batch-mode -pl billsoft

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            billsoft/target/surefire-reports/
            launcher/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: billsoft/target/site/jacoco/
          if-no-files-found: ignore

      - name: Package RupeeCRM Web Application
        run: |
          mvn package --batch-mode -pl billsoft -DskipTests

      - name: Install UI Regression Dependencies & Playwright Browsers
        working-directory: ./ui-regression
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure Local Hostname Mapping for Canonical Hostname
        run: |
          echo "127.0.0.1 management.rupeecrm.local" | sudo tee -a /etc/hosts

      - name: Start RupeeCRM Backend & Run Playwright UI Regression Suite
        working-directory: ./ui-regression
        env:
          BASE_URL: http://127.0.0.1:28080
        run: |
          echo "Starting RupeeCRM backend application on port 28080..."
          java -jar ../billsoft/target/billsoft-0.0.1-SNAPSHOT.war &
          SERVER_PID=$!

          # Guarantee server shutdown on step completion/failure
          trap 'echo "Stopping RupeeCRM server (PID $SERVER_PID)..."; kill $SERVER_PID 2>/dev/null || true' EXIT

          echo "Waiting for RupeeCRM server to be healthy on port 28080..."
          TIMEOUT=60
          READY=0
          for i in $(seq 1 $TIMEOUT); do
            if curl -s -f http://127.0.0.1:28080/api/health > /dev/null 2>&1 || curl -s -f http://127.0.0.1:28080/index.html > /dev/null 2>&1; then
              echo "RupeeCRM backend is UP and responsive (waited ${i}s)!"
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "ERROR: RupeeCRM failed to start within ${TIMEOUT}s!"
            exit 1
          fi

          echo "Seeding default business firm for full UI regression test coverage..."
          curl -s -X POST http://127.0.0.1:28080/api/firm \
            -H "Content-Type: application/json" \
            -d '{"firmName":"RupeeCRM Demo Enterprise","ownerName":"Ranjeet Yelave","contactNumber":"9876543210","email":"contact@rupeecrm.local","address":"Pune, Maharashtra, India","gstin":"27AAAAA0000A1Z5"}' || true

          echo "Executing Playwright UI regression tests..."
          npm test
          TEST_EXIT_CODE=$?

          exit $TEST_EXIT_CODE

      - name: Upload Playwright Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui-regression/playwright-report/
            ui-regression/test-results/
          if-no-files-found: ignore
