name: Build and Release

on:
  push:
    branches:
      - PROD
  workflow_dispatch:

concurrency:
  group: production-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build-app:
    runs-on: ubuntu-latest
    outputs:
      has_signing_key: ${{ steps.check-key.outputs.has_key }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Signing Key Availability
        id: check-key
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY || secrets.RELEASE_SIGNING_PRIVATE_KEY || secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_PRIVATE_KEY" ] && [ -n "$(echo "$UPDATE_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Update version in application.properties
        working-directory: ./billsoft
        run: |
          sed -i "s/app.version=.*/app.version=v1.0.${{ github.run_number }}/" src/main/resources/application.properties

      - name: Build Backend and Launcher with Maven
        run: |
          find ~/.m2/repository -name "_remote.repositories" -delete 2>/dev/null || true
          find ~/.m2/repository -name "*.lastUpdated" -delete 2>/dev/null || true
          mvn clean package -DskipTests --batch-mode

      - name: Run Final Phase Comprehensive Certification Tests
        run: |
          mvn test -pl billsoft -Dtest=Category3BackupAndRestoreStabilizationTest,Category4CloudDataProtectionAndSmtRecoveryTest,Category5SecurityAndDataIntegrityCertificationTest,AnnouncementServiceTest,AnnouncementControllerTest,FinalPhaseCrossProjectIntegrationCertificationTest --batch-mode

      - name: Stage Application Binaries
        run: |
          mkdir -p app-binaries
          if [ -f billsoft/target/billsoft-0.0.1-SNAPSHOT.war ]; then
            cp billsoft/target/billsoft-0.0.1-SNAPSHOT.war app-binaries/rupeecrm.war
          elif [ -f billsoft/target/rupeecrm.war ]; then
            cp billsoft/target/rupeecrm.war app-binaries/rupeecrm.war
          else
            echo "CRITICAL: No WAR found in billsoft/target!"
            exit 1
          fi

          if [ -f launcher/target/launcher-0.0.1-SNAPSHOT.jar ]; then
            cp launcher/target/launcher-0.0.1-SNAPSHOT.jar app-binaries/launcher-0.0.1-SNAPSHOT.jar
          else
            echo "CRITICAL: No JAR found in launcher/target!"
            exit 1
          fi

          # Verify packaged WAR internal version matches build run
          WAR_VER=$(unzip -p app-binaries/rupeecrm.war WEB-INF/classes/application.properties | grep "app.version=" | cut -d= -f2 | tr -d '\r')
          echo "✓ Verified WAR internal version: $WAR_VER"
          if [ "$WAR_VER" != "v1.0.${{ github.run_number }}" ]; then
            echo "CRITICAL: Packaged WAR internal version ($WAR_VER) does not match expected v1.0.${{ github.run_number }}!"
            exit 1
          fi

          echo "=== Staged app-binaries directory contents ==="
          ls -lh app-binaries/

      - name: Upload Application Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-binaries
          path: app-binaries/
          if-no-files-found: error
          retention-days: 3

  build-windows-installer:
    name: Build Electron Windows Installer
    runs-on: windows-latest
    needs: [build-app]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Application Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-binaries
          path: app-binaries

      - name: Validate Downloaded Application Binaries
        shell: pwsh
        run: |
          Write-Host "=== Inspecting app-binaries directory ==="
          if (-not (Test-Path "app-binaries/rupeecrm.war") -or -not (Test-Path "app-binaries/launcher-0.0.1-SNAPSHOT.jar")) {
            Write-Error "CRITICAL: Required build artifacts missing from app-binaries!"
            exit 1
          }
          Write-Host "✓ Verified rupeecrm.war ($((Get-Item app-binaries/rupeecrm.war).Length) bytes)"
          Write-Host "✓ Verified launcher jar ($((Get-Item app-binaries/launcher-0.0.1-SNAPSHOT.jar).Length) bytes)"

      - name: Stage Electron Resources and Bundled JRE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/electron/resources
          Copy-Item app-binaries/rupeecrm.war desktop/electron/resources/rupeecrm.war
          Copy-Item app-binaries/launcher-0.0.1-SNAPSHOT.jar desktop/electron/resources/launcher.jar

          # Stage runner's authoritative OpenJDK 21 into resources/jre
          Write-Host "Staging Java 21 JRE from $env:JAVA_HOME into desktop/electron/resources/jre..."
          Copy-Item -Recurse "$env:JAVA_HOME" desktop/electron/resources/jre

          if (-not (Test-Path "desktop/electron/resources/jre/bin/javaw.exe")) {
            throw "Staged JRE is missing bin/javaw.exe!"
          }
          Write-Host "✓ Staged bundled OpenJDK 21 runtime successfully."

      - name: Synchronize Electron Package Version and Validate Resources
        shell: pwsh
        run: |
          $pkgPath = "desktop/electron/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = "1.0.${{ github.run_number }}"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content $pkgPath -Encoding UTF8
          Write-Host "✓ Synchronized Electron package.json version to $($pkg.version)"

          Write-Host "Executing prepare-resources.js to validate WAR version agreement..."
          node desktop/electron/scripts/prepare-resources.js

      - name: Install Electron Dependencies and Run Tests
        working-directory: ./desktop/electron
        run: |
          npm ci
          npm test

      - name: Build Electron Windows x64 NSIS Installer
        working-directory: ./desktop/electron
        run: |
          npx electron-builder --win --x64

      - name: Verify and Stage Distribution Artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/electron/dist" -Filter "*.exe" | Where-Object { $_.Name -like "*-Setup-*" } | Select-Object -First 1
          if (-not $installer) {
            throw "CRITICAL: electron-builder did not produce a Setup .exe installer in desktop/electron/dist!"
          }

          if ($installer.Length -lt 50MB) {
            throw "CRITICAL: Installer size is unexpectedly small: $($installer.Length) bytes!"
          }

          Write-Host "✓ Verified Windows Setup Installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 2)) MB)"

          New-Item -ItemType Directory -Force -Path release-dist
          Copy-Item $installer.FullName "release-dist/RupeeCRM-Setup.exe" -Force
          Copy-Item $installer.FullName "release-dist/$($installer.Name)" -Force

          # Direct WAR & checksum assets for existing in-app update pipeline
          Copy-Item app-binaries/rupeecrm.war release-dist/rupeecrm.war
          Copy-Item app-binaries/rupeecrm.war release-dist/billsoft.war
          (Get-FileHash -Algorithm SHA256 release-dist/rupeecrm.war).Hash.ToLower() | Out-File -Encoding ASCII release-dist/rupeecrm.war.sha256
          (Get-FileHash -Algorithm SHA256 release-dist/billsoft.war).Hash.ToLower() | Out-File -Encoding ASCII release-dist/billsoft.war.sha256
          # Also generate SHA256 checksums for the installer executables
          (Get-FileHash -Algorithm SHA256 "release-dist/$($installer.Name)").Hash.ToLower() | Out-File -Encoding ASCII "release-dist/$($installer.Name).sha256"
          (Get-FileHash -Algorithm SHA256 "release-dist/RupeeCRM-Setup.exe").Hash.ToLower() | Out-File -Encoding ASCII "release-dist/RupeeCRM-Setup.exe.sha256"

      - name: Upload Windows Installer and Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rupeecrm-windows-installer
          path: release-dist/
          if-no-files-found: error
          retention-days: 3

  build-mac-installer:
    name: Build Electron macOS ARM64 Installer
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [build-app]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Application Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-binaries
          path: app-binaries

      - name: Validate Downloaded Application Binaries
        shell: bash
        run: |
          echo "=== Inspecting app-binaries directory ==="
          if [ ! -f "app-binaries/rupeecrm.war" ] || [ ! -f "app-binaries/launcher-0.0.1-SNAPSHOT.jar" ]; then
            echo "CRITICAL: Required build artifacts missing from app-binaries!"
            exit 1
          fi
          echo "✓ Verified rupeecrm.war ($(stat -f%z app-binaries/rupeecrm.war) bytes)"
          echo "✓ Verified launcher jar ($(stat -f%z app-binaries/launcher-0.0.1-SNAPSHOT.jar) bytes)"

      - name: Stage Electron Resources and Bundled macOS JRE
        shell: bash
        run: |
          mkdir -p desktop/electron/resources
          cp app-binaries/rupeecrm.war desktop/electron/resources/rupeecrm.war
          cp app-binaries/launcher-0.0.1-SNAPSHOT.jar desktop/electron/resources/launcher.jar

          # Stage runner's authoritative Apple Silicon OpenJDK 21 into resources/jre
          echo "Staging Java 21 JRE from $JAVA_HOME into desktop/electron/resources/jre..."
          cp -R "$JAVA_HOME" desktop/electron/resources/jre

          if [ ! -f "desktop/electron/resources/jre/bin/java" ]; then
            echo "CRITICAL: Staged JRE is missing bin/java!"
            exit 1
          fi
          chmod +x desktop/electron/resources/jre/bin/java
          echo "✓ Staged bundled Apple Silicon OpenJDK 21 runtime successfully."

      - name: Synchronize Electron Package Version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const p = "desktop/electron/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.version = "1.0.${{ github.run_number }}";
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
            console.log("✓ Synchronized package.json version to " + pkg.version);
          '

      - name: Install Electron Dependencies and Run Tests
        working-directory: ./desktop/electron
        run: |
          npm ci
          npm run prepare:resources
          npm test

      - name: Build Electron macOS arm64 Packages
        working-directory: ./desktop/electron
        run: |
          npx electron-builder --mac --arm64 -c.mac.identity=null

      - name: Verify and Stage macOS Distribution Artifacts
        shell: bash
        run: |
          mkdir -p mac-release-dist
          echo "=== Inspecting desktop/electron/dist ==="
          ls -lh desktop/electron/dist/

          DMG=$(find desktop/electron/dist -maxdepth 1 -name "RupeeCRM-*-arm64.dmg" | head -n 1)
          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            echo "CRITICAL: electron-builder did not produce a .dmg installer in desktop/electron/dist!"
            exit 1
          fi

          DMG_SIZE=$(stat -f%z "$DMG" 2>/dev/null || stat -c%s "$DMG" 2>/dev/null)
          if [ "$DMG_SIZE" -lt 50000000 ]; then
            echo "CRITICAL: DMG size is unexpectedly small: $DMG_SIZE bytes!"
            exit 1
          fi

          DMG_NAME=$(basename "$DMG")
          echo "✓ Verified macOS DMG Installer: $DMG_NAME ($((DMG_SIZE / 1048576)) MB)"
          cp "$DMG" "mac-release-dist/$DMG_NAME"
          cp "$DMG" "mac-release-dist/RupeeCRM-arm64.dmg"

          # Stage zip if generated
          ZIP=$(find desktop/electron/dist -maxdepth 1 -name "RupeeCRM-*-arm64*.zip" | head -n 1)
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            ZIP_NAME=$(basename "$ZIP")
            echo "✓ Found macOS ZIP: $ZIP_NAME"
            cp "$ZIP" "mac-release-dist/$ZIP_NAME"
            shasum -a 256 "$ZIP" | awk '{print $1}' > "mac-release-dist/$ZIP_NAME.sha256"
          fi

          # Generate SHA256 checksums
          shasum -a 256 "$DMG" | awk '{print $1}' > "mac-release-dist/$DMG_NAME.sha256"
          shasum -a 256 "mac-release-dist/RupeeCRM-arm64.dmg" | awk '{print $1}' > "mac-release-dist/RupeeCRM-arm64.dmg.sha256"

          echo "=== Staged mac-release-dist contents ==="
          ls -lh mac-release-dist/

      - name: Upload macOS Installer and Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rupeecrm-mac-installer
          path: mac-release-dist/
          if-no-files-found: error
          retention-days: 3

  verify-windows-installation:
    name: Verify Windows Installation Lifecycle
    runs-on: windows-latest
    needs: [build-app, build-windows-installer]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Application Binaries
        uses: actions/download-artifact@v4
        with:
          name: app-binaries
          path: app-binaries

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: rupeecrm-windows-installer
          path: release-dist

      - name: Validate Binary Consistency
        shell: pwsh
        run: |
          Write-Host "=== Validating Artifact Integrity & Consistency ==="
          $rawWar = "app-binaries/rupeecrm.war"
          $distWar = "release-dist/rupeecrm.war"
          if (-not (Test-Path $rawWar) -or -not (Test-Path $distWar)) {
            throw "CRITICAL: rupeecrm.war missing from artifacts!"
          }
          $rawHash = (Get-FileHash -Algorithm SHA256 $rawWar).Hash.ToLower()
          $distHash = (Get-FileHash -Algorithm SHA256 $distWar).Hash.ToLower()
          if ($rawHash -ne $distHash) {
            throw "CRITICAL: rupeecrm.war hash mismatch between build-app ($rawHash) and release-dist ($distHash)!"
          }
          Write-Host "✓ Verified consistent rupeecrm.war SHA256: $rawHash"

      - name: Test Silent Windows Installation & Runtime Verification
        shell: pwsh
        run: |
          Write-Host "=== Testing Silent Installation on Windows Runner ==="
          $installer = Get-ChildItem "release-dist" -Filter "*.exe" | Where-Object { $_.Name -like "*-Setup-*" } | Select-Object -First 1
          if (-not $installer) {
            throw "CRITICAL: Setup installer not found in release-dist!"
          }
          Write-Host "Running installer: $($installer.FullName)..."
          Start-Sleep -Seconds 5
          $installAttempts = 0
          $installSuccess = $false
          while ($installAttempts -lt 3 -and -not $installSuccess) {
            $installAttempts++
            $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/currentuser" -Wait -PassThru
            Write-Host "Installer attempt $installAttempts finished with exit code: $($installProcess.ExitCode)"
            if ($installProcess.ExitCode -eq 0) {
              $installSuccess = $true
            } else {
              Write-Host "Install attempt $installAttempts exited with code $($installProcess.ExitCode). Waiting 5s before retry..."
              Start-Sleep -Seconds 5
            }
          }
          if (-not $installSuccess) {
            throw "Installer exited with non-zero exit code: $($installProcess.ExitCode)"
          }
          Write-Host "✓ Silent installation finished successfully."

          # Verify installed application directory
          $installDir = "$env:LOCALAPPDATA\Programs\RupeeCRM"
          if (-not (Test-Path "$installDir\RupeeCRM.exe")) {
            throw "CRITICAL: Installed RupeeCRM.exe not found at $installDir\RupeeCRM.exe!"
          }
          if (-not (Test-Path "$installDir\resources\rupeecrm.war")) {
            throw "CRITICAL: Installed rupeecrm.war not found at $installDir\resources\rupeecrm.war!"
          }
          Write-Host "✓ Verified installation directory structure at $installDir"

          # Verify installed rupeecrm.war matches built war
          $installedHash = (Get-FileHash -Algorithm SHA256 "$installDir\resources\rupeecrm.war").Hash.ToLower()
          $builtHash = (Get-FileHash -Algorithm SHA256 "app-binaries/rupeecrm.war").Hash.ToLower()
          if ($installedHash -ne $builtHash) {
            throw "CRITICAL: Installed rupeecrm.war hash ($installedHash) does not match built artifact ($builtHash)!"
          }
          Write-Host "✓ Verified installed WAR binary matches build artifact."

          # Verify Windows PE Branding on RupeeCRM.exe
          $exeInfo = (Get-Item "$installDir\RupeeCRM.exe").VersionInfo
          Write-Host "RupeeCRM.exe ProductName: $($exeInfo.ProductName), FileDescription: $($exeInfo.FileDescription)"
          if ($exeInfo.ProductName -ne "RupeeCRM") {
            throw "CRITICAL: RupeeCRM.exe PE branding failed! Expected ProductName 'RupeeCRM' but got '$($exeInfo.ProductName)'"
          }
          Write-Host "✓ Verified Windows PE Branding on RupeeCRM.exe successfully."

          # Launch installed RupeeCRM application in background
          Write-Host "=== Launching Installed RupeeCRM Application ==="
          $appProc = Start-Process -FilePath "$installDir\RupeeCRM.exe" -ArgumentList "--hidden" -PassThru
          Write-Host "RupeeCRM process started with PID: $($appProc.Id)"

          $expectedVersion = "1.0.${{ github.run_number }}"
          Write-Host "Expected build version: $expectedVersion"

          $verified = $false
          $attempts = 0
          $maxAttempts = 60
          $identityUrl = "http://127.0.0.1:28080/api/system/runtime-identity"
          $healthUrl = "http://127.0.0.1:28080/api/health"
          $updateStatusUrl = "http://127.0.0.1:28080/api/system/update-status"

          while ($attempts -lt $maxAttempts -and -not $verified) {
            Start-Sleep -Seconds 2
            $attempts++
            try {
              $identity = Invoke-RestMethod -Uri $identityUrl -TimeoutSec 3 -ErrorAction SilentlyContinue
              if ($identity -and $identity.status -eq "UP") {
                Write-Host "✓ Backend active on port 28080! Reported version: $($identity.version)"
                $reported = "$($identity.version)".Trim()
                if ($reported -eq "1.0.320" -or $reported -eq "v1.0.320") {
                  throw "CRITICAL FAILURE: Installed application reported stale Build 320 instead of $expectedVersion!"
                }
                if ($reported -ne $expectedVersion -and $reported -ne "v$expectedVersion") {
                  throw "CRITICAL FAILURE: Reported version ($reported) does not match expected ($expectedVersion)!"
                }
                $verified = $true
              }
            } catch {
              $errMsg = "$($_.Exception.Message)"
              if ($errMsg -like "*CRITICAL FAILURE*") {
                throw
              }
              Write-Host "Waiting for backend on port 28080 (attempt $attempts/$maxAttempts)..."
            }
          }

          if (-not $verified) {
            $logPath = "$env:LOCALAPPDATA\RupeeCRM\logs\application.log"
            if (Test-Path $logPath) {
              Write-Host "=== Application Log Dump ==="
              Get-Content $logPath -Tail 50
            }
            throw "CRITICAL TIMEOUT: Backend did not respond on port 28080 within timeout!"
          }

          Write-Host "=== Verifying /api/system/update-status Endpoint ==="
          $updateResp = Invoke-RestMethod -Uri $updateStatusUrl -TimeoutSec 5
          Write-Host "update-status currentVersion: $($updateResp.currentVersion)"
          if ($updateResp.currentVersion -eq "1.0.320" -or $updateResp.currentVersion -eq "v1.0.320") {
            throw "CRITICAL FAILURE: /api/system/update-status reported stale Build 320!"
          }

          Write-Host "✓ SUCCESS: Installed application verified running $expectedVersion on Windows runner!"

          # -------------------------------------------------------------
          # Test Customer Data Creation & Protection
          # -------------------------------------------------------------
          Write-Host "=== Staging Synthetic Customer Data for Preservation Verification ==="
          $dataDir = "$env:LOCALAPPDATA\RupeeCRM\data"
          if (-not (Test-Path $dataDir)) {
            New-Item -ItemType Directory -Force -Path $dataDir
          }
          $canaryFile = "$dataDir\synthetic-customer-record.canary"
          Set-Content -Path $canaryFile -Value "CANARY_CUSTOMER_DATA_VERIFICATION_$expectedVersion"
          Write-Host "✓ Staged customer data canary file at $canaryFile"

          # -------------------------------------------------------------
          # Test Uninstallation while RupeeCRM Application is Running
          # -------------------------------------------------------------
          Write-Host "=== Testing Silent Uninstallation while Application is Running ==="
          $uninstaller = "$installDir\Uninstall RupeeCRM.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "CRITICAL: Uninstaller executable not found at $uninstaller!"
          }

          Write-Host "Executing uninstaller: $uninstaller /S..."
          $uninstProc = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          Write-Host "Uninstaller finished with exit code: $($uninstProc.ExitCode)"
          if ($uninstProc.ExitCode -ne 0) {
            throw "Uninstaller exited with non-zero exit code: $($uninstProc.ExitCode)"
          }

          # Verify no RupeeCRM-owned orphan process remains
          Write-Host "Verifying termination of all RupeeCRM processes..."
          Start-Sleep -Seconds 2
          $runningRupeeProcs = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            ($_.Name -eq "RupeeCRM.exe") -or (($_.Name -like "*java*.exe") -and ($_.CommandLine -match "(?i)(rupeecrm|billsoft|RupeeCRMLauncher|RupeeCRM-Launcher|launcher\.jar)"))
          }
          if ($runningRupeeProcs) {
            $pids = ($runningRupeeProcs | ForEach-Object { "$($_.Name):$($_.ProcessId)" }) -join ", "
            throw "CRITICAL: Orphan RupeeCRM process(es) remained active after uninstallation: $pids"
          }
          Write-Host "✓ Confirmed zero RupeeCRM or Java backend orphan processes active."

          # Verify port 28080 is released
          $listeningConn = Get-NetTCPConnection -LocalPort 28080 -State Listen -ErrorAction SilentlyContinue
          if ($listeningConn) {
            throw "CRITICAL: Port 28080 remained listening after uninstallation (PID: $($listeningConn.OwningProcess))!"
          }
          Write-Host "✓ Confirmed port 28080 successfully released."

          # Verify installation directory is removed
          if (Test-Path "$installDir\RupeeCRM.exe") {
            throw "CRITICAL: $installDir\RupeeCRM.exe was not deleted during uninstallation!"
          }
          if (Test-Path "$installDir\resources\rupeecrm.war") {
            throw "CRITICAL: $installDir\resources\rupeecrm.war was not deleted during uninstallation!"
          }
          Write-Host "✓ Confirmed application binaries and backend WAR removed successfully."

          # Verify customer data canary is 100% intact
          if (-not (Test-Path $canaryFile)) {
            throw "CRITICAL DATA LOSS: Customer canary data ($canaryFile) was deleted during uninstallation!"
          }
          $canaryContent = Get-Content -Path $canaryFile -Raw
          if ($canaryContent -notmatch "CANARY_CUSTOMER_DATA_VERIFICATION") {
            throw "CRITICAL DATA CORRUPTION: Customer canary content was modified or corrupted!"
          }
          Write-Host "✓ Verified customer data was completely preserved during uninstallation."

          # -------------------------------------------------------------
          # Test Reinstallation after Uninstallation
          # -------------------------------------------------------------
          Write-Host "=== Testing Clean Reinstallation after Uninstallation ==="
          Start-Sleep -Seconds 5
          $reinstallAttempts = 0
          $reinstallSuccess = $false
          while ($reinstallAttempts -lt 3 -and -not $reinstallSuccess) {
            $reinstallAttempts++
            $reinstallProc = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/currentuser" -Wait -PassThru
            if ($reinstallProc.ExitCode -eq 0) {
              $reinstallSuccess = $true
            } else {
              Write-Host "Reinstall attempt $reinstallAttempts exited with code $($reinstallProc.ExitCode). Waiting 5s before retry..."
              Start-Sleep -Seconds 5
            }
          }
          if (-not $reinstallSuccess) {
            throw "Reinstallation failed with exit code: $($reinstallProc.ExitCode)"
          }
          if (-not (Test-Path "$installDir\RupeeCRM.exe") -or -not (Test-Path "$installDir\resources\rupeecrm.war")) {
            throw "CRITICAL: Reinstalled application binaries missing from $installDir!"
          }
          if (-not (Test-Path $canaryFile)) {
            throw "CRITICAL DATA LOSS: Customer canary data was lost after reinstallation!"
          }
          Write-Host "✓ Reinstallation succeeded and customer data preserved."

          # Launch reinstalled app and verify runtime health
          Write-Host "=== Launching Reinstalled Application ==="
          $reappProc = Start-Process -FilePath "$installDir\RupeeCRM.exe" -ArgumentList "--hidden" -PassThru
          $reverified = $false
          $reattempts = 0
          while ($reattempts -lt 45 -and -not $reverified) {
            Start-Sleep -Seconds 2
            $reattempts++
            try {
              $ident = Invoke-RestMethod -Uri $identityUrl -TimeoutSec 3 -ErrorAction SilentlyContinue
              if ($ident -and $ident.status -eq "UP") {
                Write-Host "✓ Reinstalled backend active on port 28080! Version: $($ident.version)"
                $reverified = $true
              }
            } catch {}
          }
          if (-not $reverified) {
            throw "CRITICAL: Reinstalled application failed to signal backend health!"
          }

          # Clean shutdown via HTTP API
          try {
            Invoke-RestMethod -Uri "http://127.0.0.1:28080/api/shutdown" -Method Post -TimeoutSec 3 -ErrorAction SilentlyContinue
          } catch {}
          Start-Sleep -Seconds 2
          Stop-Process -Id $reappProc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "✓ Windows Full Lifecycle Acceptance Check Complete: Install -> Runtime Verify -> Running Uninstall -> Orphan Process Audit -> Customer Data Preservation -> Reinstall -> Re-verify."

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-app, build-windows-installer, build-mac-installer, verify-windows-installation]
    if: github.repository == 'RanjeetYelave/Simple-Billing' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/PROD' || github.ref_name == 'PROD' || github.ref == 'refs/heads/main' || github.ref_name == 'main' || github.ref == 'refs/heads/overhaul' || github.ref_name == 'overhaul' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify CI Java Regression Tests Succeeded
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Verifying CI Java Regression Tests Status ==="
          COMMIT_SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          MAX_ATTEMPTS=45
          ATTEMPT=0
          FOUND_RUN=false

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            RUNS_JSON=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/runs?head_sha=${COMMIT_SHA}")

            STATUS=$(echo "$RUNS_JSON" | jq -r '.workflow_runs[] | select(.name=="CI Java Regression Tests") | .status' | head -n 1)
            CONCLUSION=$(echo "$RUNS_JSON" | jq -r '.workflow_runs[] | select(.name=="CI Java Regression Tests") | .conclusion' | head -n 1)

            if [ -n "$STATUS" ] && [ "$STATUS" != "null" ]; then
              FOUND_RUN=true
              if [ "$STATUS" = "completed" ]; then
                echo "CI Java Regression Tests completed with conclusion: ${CONCLUSION}"
                if [ "$CONCLUSION" != "success" ]; then
                  echo "CRITICAL: CI Java Regression Tests failed with conclusion '${CONCLUSION}'! Aborting release."
                  exit 1
                fi
                echo "✓ Verified: CI Java Regression Tests passed successfully."
                break
              else
                echo "CI Java Regression Tests is in state '${STATUS}' (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)... waiting 10s"
              fi
            else
              echo "Waiting for CI Java Regression Tests run to register (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)... waiting 10s"
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done

          if [ "$FOUND_RUN" = "true" ] && [ "$STATUS" != "completed" ]; then
            echo "CRITICAL: Timed out waiting for CI Java Regression Tests to complete! Aborting release."
            exit 1
          elif [ "$FOUND_RUN" = "false" ]; then
            echo "Notice: No CI Java Regression Tests workflow run found for commit ${COMMIT_SHA}. Continuing release process."
          fi

      - name: Download Application Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-binaries
          path: app-binaries

      - name: Download Windows Installer Artifacts
        uses: actions/download-artifact@v4
        with:
          name: rupeecrm-windows-installer
          path: release-dist

      - name: Download macOS Installer Artifacts
        uses: actions/download-artifact@v4
        with:
          name: rupeecrm-mac-installer
          path: release-dist

      - name: Validate Downloaded Distribution Artifacts
        shell: bash
        run: |
          echo "=== Validating Downloaded Distribution Artifacts ==="
          ls -lh release-dist/

          INSTALLER=$(find release-dist -maxdepth 1 -name "RupeeCRM-Setup-*-x64.exe" | head -n 1)
          if [ -z "$INSTALLER" ] || [ ! -f "$INSTALLER" ]; then
            echo "CRITICAL ERROR: RupeeCRM-Setup-*-x64.exe not found in release-dist!"
            exit 1
          fi

          FILESIZE=$(stat -c%s "$INSTALLER" 2>/dev/null || stat -f%z "$INSTALLER" 2>/dev/null)
          if [ "$FILESIZE" -lt 50000000 ]; then
            echo "CRITICAL ERROR: Installer size ($FILESIZE bytes) is suspiciously small! Aborting release."
            exit 1
          fi
          echo "✓ Verified Windows Setup Installer: $INSTALLER ($((FILESIZE / 1048576)) MB)"

          DMG=$(find release-dist -maxdepth 1 -name "RupeeCRM-*-arm64.dmg" 2>/dev/null | grep -v "RupeeCRM-arm64.dmg" | head -n 1)
          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            echo "CRITICAL ERROR: Versioned RupeeCRM-*-arm64.dmg not found in release-dist!"
            exit 1
          fi
          DMG_SIZE=$(stat -c%s "$DMG" 2>/dev/null || stat -f%z "$DMG" 2>/dev/null)
          if [ "$DMG_SIZE" -lt 50000000 ]; then
            echo "CRITICAL ERROR: DMG size ($DMG_SIZE bytes) is suspiciously small! Aborting release."
            exit 1
          fi
          echo "✓ Verified macOS DMG Installer: $DMG ($((DMG_SIZE / 1048576)) MB)"

          CANONICAL_DMG="release-dist/RupeeCRM-arm64.dmg"
          if [ ! -f "$CANONICAL_DMG" ]; then
            echo "CRITICAL ERROR: Canonical RupeeCRM-arm64.dmg missing from release-dist!"
            exit 1
          fi
          echo "✓ Verified Canonical macOS DMG: $CANONICAL_DMG"

          # Generate SHA256SUMS.txt
          cd release-dist
          sha256sum RupeeCRM-Setup*.exe *.war *.dmg *.zip 2>/dev/null > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
          cd ..

      - name: Prepare Release Metadata and Notes
        id: prep-release
        shell: bash
        run: |
          APP_VERSION="1.0.${{ github.run_number }}"
          TAG_NAME="v1.0.${{ github.run_number }}"

          RELEASE_TITLE="RupeeCRM v${APP_VERSION} (Build ${{ github.run_number }})"
          INSTALLER_FILE=$(find release-dist -maxdepth 1 -name "RupeeCRM-Setup-*-x64.exe" | head -n 1)
          INSTALLER_NAME=$(basename "$INSTALLER_FILE")
          INSTALLER_SIZE=$(ls -lh "$INSTALLER_FILE" | awk '{print $5}')
          INSTALLER_HASH=$(cat "release-dist/${INSTALLER_NAME}.sha256" 2>/dev/null || sha256sum "$INSTALLER_FILE" | awk '{print $1}')
          CANONICAL_SIZE=$(ls -lh "release-dist/RupeeCRM-Setup.exe" | awk '{print $5}')
          CANONICAL_HASH=$(cat "release-dist/RupeeCRM-Setup.exe.sha256" 2>/dev/null || sha256sum "release-dist/RupeeCRM-Setup.exe" | awk '{print $1}')

          DMG_FILE=$(find release-dist -maxdepth 1 -name "RupeeCRM-*-arm64.dmg" 2>/dev/null | grep -v "RupeeCRM-arm64.dmg" | head -n 1)
          if [ -z "$DMG_FILE" ] || [ ! -f "$DMG_FILE" ]; then
            echo "CRITICAL: No versioned DMG found in release-dist!"
            exit 1
          fi
          DMG_NAME=$(basename "$DMG_FILE")
          DMG_SIZE=$(ls -lh "$DMG_FILE" | awk '{print $5}')
          DMG_HASH=$(cat "release-dist/${DMG_NAME}.sha256" 2>/dev/null || sha256sum "$DMG_FILE" | awk '{print $1}')
          CANONICAL_DMG_SIZE=$(ls -lh "release-dist/RupeeCRM-arm64.dmg" | awk '{print $5}')
          CANONICAL_DMG_HASH=$(cat "release-dist/RupeeCRM-arm64.dmg.sha256" 2>/dev/null || sha256sum "release-dist/RupeeCRM-arm64.dmg" | awk '{print $1}')
          echo "dmg_name=${DMG_NAME}" >> "$GITHUB_OUTPUT"
          echo "dmg_size=${DMG_SIZE}" >> "$GITHUB_OUTPUT"
          echo "dmg_hash=${DMG_HASH}" >> "$GITHUB_OUTPUT"

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "installer_name=${INSTALLER_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

          sed "s/^[ \t]*//" << EOF > release-notes.md
          ## ${RELEASE_TITLE}

          Official production release built from branch \`${{ github.ref_name }}\`.

          ### Build Information
          - **Application Version:** \`v${APP_VERSION}\`
          - **Release Tag:** \`${TAG_NAME}\`
          - **Build Number:** \`${{ github.run_number }}\`
          - **Commit SHA:** \`${{ github.sha }}\`
          - **Branch:** \`${{ github.ref_name }}\`
          - **Workflow Run:** [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### Downloadable Distribution Packages
          | Package Type | File | Size | SHA256 Checksum |
          |---|---|---|---|
          | **Windows x64 Installer (Versioned)** | [\`${INSTALLER_NAME}\`](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${INSTALLER_NAME}) | \`${INSTALLER_SIZE}\` | \`${INSTALLER_HASH}\` |
          | **Windows x64 Installer (Latest)** | [\`RupeeCRM-Setup.exe\`](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/RupeeCRM-Setup.exe) | \`${CANONICAL_SIZE}\` | \`${CANONICAL_HASH}\` |
          | **macOS ARM64 DMG (Versioned)** | [\`${DMG_NAME}\`](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${DMG_NAME}) | \`${DMG_SIZE}\` | \`${DMG_HASH}\` |
          | **macOS ARM64 DMG (Latest)** | [\`RupeeCRM-arm64.dmg\`](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/RupeeCRM-arm64.dmg) | \`${CANONICAL_DMG_SIZE}\` | \`${CANONICAL_DMG_HASH}\` |
          | **In-App OTA Application Package** | [\`rupeecrm.war\`](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/rupeecrm.war) | \`~84 MB\` | See \`SHA256SUMS.txt\` |
          | **Legacy OTA Package** | [\`billsoft.war\`](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/billsoft.war) | \`~84 MB\` | See \`SHA256SUMS.txt\` |
          | **Dedicated Manual OTA Update Package** | [\`RupeeCRM-Update-${APP_VERSION}.zip\`](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/RupeeCRM-Update-${APP_VERSION}.zip) | \`~81 MB\` | See \`.sha256\` |
          | **Integrity Checksums** | [\`SHA256SUMS.txt\`](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/SHA256SUMS.txt) | \`<1 KB\` | Checksum Manifest |

          ### Verification (PowerShell)
          \`\`\`powershell
          (Get-FileHash -Algorithm SHA256 .\\${INSTALLER_NAME}).Hash -eq "${INSTALLER_HASH}"
          \`\`\`

          ### Verification (macOS Terminal)
          \`\`\`bash
          shasum -a 256 ${DMG_NAME}
          \`\`\`

          > [!NOTE]
          > Official stable production release v${APP_VERSION}. All distributable packages are published and downloadable.
          EOF

      - name: Generate and Verify Signed Release Manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY || secrets.RELEASE_SIGNING_PRIVATE_KEY || secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p release-meta build-tools

          # Compile ManifestSigner utility into isolated build-tools directory
          javac installer/ManifestSigner.java -d build-tools

          if [ -n "$UPDATE_SIGNING_PRIVATE_KEY" ] && [ -n "$(echo "$UPDATE_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')" ]; then
            RELEASE_NOTES="RupeeCRM release build ${{ github.run_number }} integrity manifest."
            RELEASE_TAG="${{ steps.prep-release.outputs.tag_name }}"
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/rupeecrm.war"
            APP_VER="${{ steps.prep-release.outputs.app_version }}"

            # Invoke ManifestSigner using --env to avoid exposing private key on process command-line
            java -cp build-tools com.billing.simple.installer.ManifestSigner sign app-binaries/rupeecrm.war "$APP_VER" --env release-meta "$RELEASE_NOTES" "$RELEASE_TAG" "$DOWNLOAD_URL"

            # Verify signature against pinned production Ed25519 public key
            PUB_KEY="MCowBQYDK2VwAyEAtdG8eJgrX0L7jtx13wOGnqSeeID2B/aRv1+OZQ7v3C8="
            java -cp build-tools com.billing.simple.installer.ManifestSigner verify release-meta/manifest.json release-meta/manifest.sig "$PUB_KEY"

            echo "=== Generated Release Manifest ==="
            cat release-meta/manifest.json
            echo "=== Generated Detached Signature ==="
            cat release-meta/manifest.sig

            cp release-meta/manifest.json release-dist/manifest.json
            cp release-meta/manifest.sig release-dist/manifest.sig

            # ── Generate Dedicated Manual/Offline OTA Update Package ──
            OTA_ZIP_NAME="RupeeCRM-Update-${APP_VER}.zip"
            OTA_STAGING_DIR="manual-ota-package"
            rm -rf "$OTA_STAGING_DIR"
            mkdir -p "$OTA_STAGING_DIR"

            # 1. Populate package contents
            cp app-binaries/rupeecrm.war "$OTA_STAGING_DIR/rupeecrm.war"
            cp release-meta/manifest.json "$OTA_STAGING_DIR/manifest.json"
            cp release-meta/manifest.sig "$OTA_STAGING_DIR/manifest.sig"

            # Create package metadata
            jq -n \
              --arg app "RupeeCRM" \
              --arg ver "${APP_VER}" \
              --arg tag "${RELEASE_TAG}" \
              --arg commit "${{ github.sha }}" \
              --arg bld "${{ github.run_number }}" \
              --arg date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              '{
                application: $app,
                version: $ver,
                releaseTag: $tag,
                commit: $commit,
                buildNumber: $bld,
                packageType: "manual-ota-update",
                generatedAt: $date
              }' > "$OTA_STAGING_DIR/package-metadata.json"

            # Create package-specific checksum file
            cd "$OTA_STAGING_DIR"
            sha256sum rupeecrm.war manifest.json manifest.sig package-metadata.json > SHA256SUMS.txt
            cat SHA256SUMS.txt

            # Build ZIP archive at root of package
            zip -9 -r "../release-dist/${OTA_ZIP_NAME}" *
            cd ..
            rm -rf "$OTA_STAGING_DIR"

            # Generate SHA256 for the OTA package itself
            cd release-dist
            shasum -a 256 "${OTA_ZIP_NAME}" | awk '{print $1}' > "${OTA_ZIP_NAME}.sha256"
            cd ..

            # ── Comprehensive 10-Point Release Package Validation ──
            echo "=== Validating Dedicated Manual OTA Update Package (${OTA_ZIP_NAME}) ==="
            OTA_ZIP_PATH="release-dist/${OTA_ZIP_NAME}"

            # Check 1: Structural validity of ZIP
            unzip -t "$OTA_ZIP_PATH" || { echo "CRITICAL: Corrupted OTA ZIP structure!"; exit 1; }
            echo "✓ Check 1/10: OTA ZIP structural integrity verified."

            # Extract into verification sandbox
            VERIFY_DIR="verify-ota-sandbox"
            rm -rf "$VERIFY_DIR"
            mkdir -p "$VERIFY_DIR"
            unzip -q "$OTA_ZIP_PATH" -d "$VERIFY_DIR"

            # Check 2: WAR corresponds to intended release
            if [ ! -f "$VERIFY_DIR/rupeecrm.war" ]; then
              echo "CRITICAL: rupeecrm.war missing from OTA package!"; exit 1;
            fi
            WAR_SIZE=$(stat -c%s "$VERIFY_DIR/rupeecrm.war" 2>/dev/null || stat -f%z "$VERIFY_DIR/rupeecrm.war" 2>/dev/null)
            if [ "$WAR_SIZE" -lt 50000000 ]; then
              echo "CRITICAL: Packaged WAR size is suspiciously small: $WAR_SIZE bytes!"; exit 1;
            fi
            echo "✓ Check 2/10: WAR binary present and sized correctly ($((WAR_SIZE / 1048576)) MB)."

            # Check 3: Manifest version and build match
            PKG_VER=$(jq -r '.appVersion' "$VERIFY_DIR/manifest.json")
            if [ "$PKG_VER" != "$APP_VER" ]; then
              echo "CRITICAL: Manifest appVersion '$PKG_VER' does not match expected '$APP_VER'!"; exit 1;
            fi
            echo "✓ Check 3/10: Manifest version matches release target ($PKG_VER)."

            # Check 4: Manifest signature verification against pinned public key
            java -cp build-tools com.billing.simple.installer.ManifestSigner verify "$VERIFY_DIR/manifest.json" "$VERIFY_DIR/manifest.sig" "$PUB_KEY" || {
              echo "CRITICAL: Manifest detached Ed25519 signature verification failed!"; exit 1;
            }
            echo "✓ Check 4/10: Manifest detached signature cryptographically verified."

            # Check 5: SHA-256 checksum of WAR matches manifest
            EXPECTED_SHA=$(jq -r '.artifact.sha256' "$VERIFY_DIR/manifest.json")
            ACTUAL_SHA=$(shasum -a 256 "$VERIFY_DIR/rupeecrm.war" | awk '{print $1}')
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "CRITICAL: WAR SHA-256 mismatch! Expected: $EXPECTED_SHA, Got: $ACTUAL_SHA"; exit 1;
            fi
            echo "✓ Check 5/10: WAR SHA-256 matches manifest ($ACTUAL_SHA)."

            # Check 6: All referenced files present
            if [ ! -f "$VERIFY_DIR/manifest.json" ] || [ ! -f "$VERIFY_DIR/manifest.sig" ] || [ ! -f "$VERIFY_DIR/SHA256SUMS.txt" ]; then
              echo "CRITICAL: Missing auxiliary package files in OTA ZIP!"; exit 1;
            fi
            echo "✓ Check 6/10: All required auxiliary files present."

            # Check 7: Extraction safety - verify no absolute paths or directory traversal in ZIP
            zipinfo -1 "$OTA_ZIP_PATH" | while read -r line; do
              if [[ "$line" == /* ]] || [[ "$line" == *..* ]]; then
                echo "CRITICAL: Unsafe path in OTA ZIP: $line"; exit 1;
              fi
            done
            echo "✓ Check 7/10: Package contains no path traversal or absolute paths."

            # Check 8: Package can be consumed by existing update engine (ZIP magic byte header check 504b0304)
            MAGIC_BYTES=$(head -c 4 "$VERIFY_DIR/rupeecrm.war" | od -A n -t x1 | tr -d ' \n')
            if [ "$MAGIC_BYTES" != "504b0304" ]; then
              echo "CRITICAL: WAR is not a valid ZIP archive! Found magic bytes: $MAGIC_BYTES"; exit 1;
            fi
            echo "✓ Check 8/10: WAR archive format valid for update engine."

            # Check 9: Package does not contain stale build artifacts
            if [ -f "$VERIFY_DIR/.billsoft-version" ]; then
              STALE_VER=$(cat "$VERIFY_DIR/.billsoft-version")
              if [ "$STALE_VER" != "v$APP_VER" ] && [ "$STALE_VER" != "$APP_VER" ]; then
                echo "CRITICAL: Found stale .billsoft-version in package: $STALE_VER"; exit 1;
              fi
            fi
            echo "✓ Check 9/10: No stale build metadata detected."

            # Check 10: Release package matches production commit
            PKG_COMMIT=$(jq -r '.commit' "$VERIFY_DIR/package-metadata.json")
            if [ "$PKG_COMMIT" != "${{ github.sha }}" ]; then
              echo "CRITICAL: Package commit '$PKG_COMMIT' does not match GitHub SHA '${{ github.sha }}'!"; exit 1;
            fi
            echo "✓ Check 10/10: Release package matches production Git commit (${PKG_COMMIT:0:7})."

            rm -rf "$VERIFY_DIR"
            echo "=== All 10 OTA Package Validations Passed Successfully ==="

            # Update SHA256SUMS.txt with manifest and OTA package checksums
            cd release-dist
            sha256sum RupeeCRM-Setup*.exe *.war manifest.* RupeeCRM-Update* > SHA256SUMS.txt
            cat SHA256SUMS.txt
            cd ..
          else
            echo "Signing key not configured; skipping manifest detached signature generation."
          fi

          # Clean up temporary build-tools directory
          rm -rf build-tools

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.prep-release.outputs.release_title }}
          tag_name: ${{ steps.prep-release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          body_path: release-notes.md
          files: |
            release-dist/*.exe
            release-dist/*.dmg
            release-dist/*.zip
            release-dist/*.sha256
            release-dist/SHA256SUMS.txt
            release-dist/*.war
            release-dist/manifest.*

      - name: Verify Published Stable Release and Attached Assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_KEY: ${{ needs.build-app.outputs.has_signing_key }}
        run: |
          echo "=== Verifying Published Stable GitHub Release ==="
          TAG="${{ steps.prep-release.outputs.tag_name }}"
          APP_VER="${{ steps.prep-release.outputs.app_version }}"
          INSTALLER="${{ steps.prep-release.outputs.installer_name }}"
          DMG_NAME="${{ steps.prep-release.outputs.dmg_name }}"
          REPO="${{ github.repository }}"

          echo "Polling GitHub Release API for tag: ${TAG}"
          sleep 5

          RELEASE_DATA=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}")

          if [ -z "$RELEASE_DATA" ]; then
            echo "CRITICAL: Could not fetch release data for tag ${TAG}!"
            exit 1
          fi

          IS_DRAFT=$(echo "$RELEASE_DATA" | jq -r '.draft')
          IS_PRERELEASE=$(echo "$RELEASE_DATA" | jq -r '.prerelease')
          RELEASE_URL=$(echo "$RELEASE_DATA" | jq -r '.html_url')

          echo "Release Page: $RELEASE_URL"
          echo "Draft: $IS_DRAFT"
          echo "Prerelease: $IS_PRERELEASE"

          if [ "$IS_DRAFT" != "false" ]; then
            echo "CRITICAL: Release is marked as draft!"
            exit 1
          fi

          if [ "$IS_PRERELEASE" != "false" ]; then
            echo "CRITICAL: Release is marked as prerelease!"
            exit 1
          fi

          echo "=== Verifying Required Attached Distributable Packages ==="
          EXPECTED_ASSETS=(
            "$INSTALLER"
            "${INSTALLER}.sha256"
            "RupeeCRM-Setup.exe"
            "RupeeCRM-Setup.exe.sha256"
            "$DMG_NAME"
            "${DMG_NAME}.sha256"
            "RupeeCRM-arm64.dmg"
            "RupeeCRM-arm64.dmg.sha256"
            "rupeecrm.war"
            "rupeecrm.war.sha256"
            "billsoft.war"
            "billsoft.war.sha256"
            "SHA256SUMS.txt"
          )

          if [ "$HAS_KEY" = "true" ]; then
            APP_VER="${{ steps.prep-release.outputs.app_version }}"
            OTA_ZIP="RupeeCRM-Update-${APP_VER}.zip"
            EXPECTED_ASSETS+=("manifest.json" "manifest.sig" "$OTA_ZIP" "${OTA_ZIP}.sha256")
          fi

          for asset in "${EXPECTED_ASSETS[@]}"; do
            ASSET_INFO=$(echo "$RELEASE_DATA" | jq -r --arg name "$asset" '.assets[] | select(.name==$name)')
            if [ -z "$ASSET_INFO" ]; then
              echo "CRITICAL: Required asset '$asset' is NOT attached to release ${TAG}!"
              exit 1
            fi
            ASSET_SIZE=$(echo "$ASSET_INFO" | jq -r '.size')
            DL_URL=$(echo "$ASSET_INFO" | jq -r '.browser_download_url')
            if [ "$ASSET_SIZE" -le 0 ]; then
              echo "CRITICAL: Asset '$asset' has invalid size: ${ASSET_SIZE} bytes!"
              exit 1
            fi
            echo "✓ Verified Asset: $asset (${ASSET_SIZE} bytes) -> $DL_URL"
          done

          echo "=== Verifying Latest Stable Release Status ==="
          LATEST_DATA=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/latest")
          LATEST_TAG=$(echo "$LATEST_DATA" | jq -r '.tag_name')

          if [ "$LATEST_TAG" != "$TAG" ]; then
            echo "Notice: /releases/latest returned '$LATEST_TAG' (waiting 10s for GitHub cache update)..."
            sleep 10
            LATEST_DATA=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/latest")
            LATEST_TAG=$(echo "$LATEST_DATA" | jq -r '.tag_name')
          fi

          if [ "$LATEST_TAG" != "$TAG" ]; then
            echo "CRITICAL: Release ${TAG} is NOT marked as latest stable release! Got: ${LATEST_TAG}"
            exit 1
          fi
          echo "✓ Confirmed: Tag ${TAG} is published as the latest stable release."

          if [ "$HAS_KEY" = "true" ]; then
            echo "=== Verifying In-App Updater Direct Endpoint ==="
            MANIFEST_HTTP=$(curl -s -o /dev/null -w "%{http_code}" -L "https://github.com/${REPO}/releases/latest/download/manifest.json")
            if [ "$MANIFEST_HTTP" != "200" ]; then
              echo "CRITICAL: In-app updater manifest URL returned HTTP ${MANIFEST_HTTP}!"
              exit 1
            fi
            echo "✓ Confirmed: In-app updater endpoint is fully operational (HTTP 200)."
          fi

          echo "=== All Release Publishing Validation Checks Passed Successfully ==="

  cleanup-old-runs:
    name: Auto-Cleanup Older Workflow Runs
    runs-on: ubuntu-latest
    needs: [build-app, build-windows-installer, publish-release]
    if: always() && needs.build-app.result == 'success' && needs.build-windows-installer.result == 'success' && (needs.publish-release.result == 'success' || needs.publish-release.result == 'skipped')

    steps:
      - name: Purge Older Workflow Runs & Artifacts
        shell: bash
        run: |
          echo "=== Auto-Purging Older Workflow Runs on Successful Build & Release ==="
          CURRENT_RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"

          TARGET_WORKFLOWS=(
            "release.yml"
            "regression-tests.yml"
            "pr-validation.yml"
            "cleanup-runs.yml"
            "test.yml"
          )

          TOTAL_ALL_DELETED=0
          TOTAL_ALL_SKIPPED=0
          TOTAL_ALL_FAILED=0

          for WF in "${TARGET_WORKFLOWS[@]}"; do
            echo "--- Inspecting workflow: $WF ---"
            PAGE=1
            WF_FOUND=0
            WF_DELETED=0
            WF_SKIPPED=0
            WF_FAILED=0

            while true; do
              RUNS_RESP=$(curl -s -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/workflows/${WF}/runs?per_page=100&page=${PAGE}")

              RUN_COUNT=$(echo "$RUNS_RESP" | jq -r '.workflow_runs // [] | length' 2>/dev/null || echo 0)
              if [ -z "$RUN_COUNT" ] || [ "$RUN_COUNT" -eq 0 ]; then
                break
              fi

              ELIGIBLE_RUNS=$(echo "$RUNS_RESP" | jq -c '.workflow_runs[]? // empty')
              if [ -z "$ELIGIBLE_RUNS" ]; then
                break
              fi

              while IFS= read -r run_item; do
                [ -z "$run_item" ] && continue
                RUN_ID=$(echo "$run_item" | jq -r '.id')
                RUN_STATUS=$(echo "$run_item" | jq -r '.status')
                RUN_CONCLUSION=$(echo "$run_item" | jq -r '.conclusion')
                RUN_CREATED=$(echo "$run_item" | jq -r '.created_at')

                WF_FOUND=$((WF_FOUND + 1))

                # Safeguard: Never delete current run
                if [ "$RUN_ID" = "$CURRENT_RUN_ID" ] || [ "$RUN_ID" = "${{ github.run_id }}" ]; then
                  echo "  Skipping current run #$RUN_ID (active release run)"
                  WF_SKIPPED=$((WF_SKIPPED + 1))
                  continue
                fi

                # Safeguard: Never delete in-progress or queued runs
                if [ "$RUN_STATUS" != "completed" ]; then
                  echo "  Skipping run #$RUN_ID ($RUN_STATUS, created $RUN_CREATED)"
                  WF_SKIPPED=$((WF_SKIPPED + 1))
                  continue
                fi

                # Attempt deletion with retry on rate limit
                echo "  Deleting old completed run #$RUN_ID ($RUN_CONCLUSION, created $RUN_CREATED)..."
                HTTP_CODE=0
                for attempt in 1 2 3; do
                  HTTP_CODE=$(curl -s -w "%{http_code}" -o /dev/null -X DELETE \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${REPO}/actions/runs/$RUN_ID")
                  
                  if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "404" ]; then
                    break
                  elif [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" = "403" ]; then
                    echo "    Rate limited (HTTP $HTTP_CODE), waiting 3s (attempt $attempt/3)..."
                    sleep 3
                  else
                    break
                  fi
                done

                if [ "$HTTP_CODE" = "204" ]; then
                  echo "    ✓ Successfully deleted run #$RUN_ID"
                  WF_DELETED=$((WF_DELETED + 1))
                elif [ "$HTTP_CODE" = "404" ]; then
                  echo "    Notice: run #$RUN_ID already purged"
                  WF_DELETED=$((WF_DELETED + 1))
                else
                  echo "    ✗ Failed to delete run #$RUN_ID (HTTP $HTTP_CODE)"
                  WF_FAILED=$((WF_FAILED + 1))
                fi
              done <<< "$ELIGIBLE_RUNS"

              PAGE=$((PAGE + 1))
            done

            echo "Summary for $WF: Found $WF_FOUND, Deleted $WF_DELETED, Skipped $WF_SKIPPED, Failed $WF_FAILED"
            TOTAL_ALL_DELETED=$((TOTAL_ALL_DELETED + WF_DELETED))
            TOTAL_ALL_SKIPPED=$((TOTAL_ALL_SKIPPED + WF_SKIPPED))
            TOTAL_ALL_FAILED=$((TOTAL_ALL_FAILED + WF_FAILED))
          done

          echo "=========================================================="
          echo "Storage maintenance complete:"
          echo "  Total older runs deleted: $TOTAL_ALL_DELETED"
          echo "  Total active runs preserved: $TOTAL_ALL_SKIPPED"
          echo "  Total deletion errors: $TOTAL_ALL_FAILED"
          echo "=========================================================="