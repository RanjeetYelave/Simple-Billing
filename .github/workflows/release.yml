name: Build and Release

on:
  push:
    branches:
      - main
      - overhaul
      - release/*
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-app:
    runs-on: ubuntu-latest
    outputs:
      has_signing_key: ${{ steps.check-key.outputs.has_key }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Signing Key Availability
        id: check-key
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY || secrets.RELEASE_SIGNING_PRIVATE_KEY || secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_PRIVATE_KEY" ] && [ -n "$(echo "$UPDATE_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Update version in application.properties
        working-directory: ./billsoft
        run: |
          sed -i "s/app.version=.*/app.version=v1.0.${{ github.run_number }}/" src/main/resources/application.properties

      - name: Build Backend and Launcher with Maven
        run: mvn clean package -DskipTests

      - name: Stage Application Binaries
        run: |
          mkdir -p app-binaries
          if [ -f billsoft/target/billsoft-0.0.1-SNAPSHOT.war ]; then
            cp billsoft/target/billsoft-0.0.1-SNAPSHOT.war app-binaries/rupeecrm.war
          elif [ -f billsoft/target/rupeecrm.war ]; then
            cp billsoft/target/rupeecrm.war app-binaries/rupeecrm.war
          else
            echo "CRITICAL: No WAR found in billsoft/target!"
            exit 1
          fi

          if [ -f launcher/target/launcher-0.0.1-SNAPSHOT.jar ]; then
            cp launcher/target/launcher-0.0.1-SNAPSHOT.jar app-binaries/launcher-0.0.1-SNAPSHOT.jar
          else
            echo "CRITICAL: No JAR found in launcher/target!"
            exit 1
          fi

          echo "=== Staged app-binaries directory contents ==="
          ls -lh app-binaries/

      - name: Upload Application Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-binaries
          path: app-binaries/
          if-no-files-found: error
          retention-days: 3

  build-windows-msi:
    runs-on: windows-latest
    needs: [build-app]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download Application Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-binaries
          path: app-binaries

      - name: Validate Downloaded Application Binaries
        shell: pwsh
        run: |
          Write-Host "=== Inspecting app-binaries directory ==="
          if (Test-Path app-binaries) {
            Get-ChildItem -Recurse app-binaries | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Error "CRITICAL: app-binaries directory does not exist!"
            exit 1
          }

          $requiredFiles = @(
            "app-binaries/rupeecrm.war",
            "app-binaries/launcher-0.0.1-SNAPSHOT.jar"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "CRITICAL: Required build artifact '$file' is missing!"
              exit 1
            } else {
              $size = (Get-Item $file).Length
              if ($size -le 1024) {
                Write-Error "CRITICAL: Artifact '$file' is empty or corrupted (size: $size bytes)!"
                exit 1
              }
              Write-Host "✓ Verified artifact: $file ($size bytes)"
            }
          }

      - name: Prepare Application Packaging Layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/RupeeCRM/app

          # Copy backend WAR
          Copy-Item app-binaries/rupeecrm.war dist/RupeeCRM/app/rupeecrm.war

          # Copy Launcher/Supervisor JAR
          Copy-Item app-binaries/launcher-0.0.1-SNAPSHOT.jar dist/RupeeCRM/launcher.jar

          # Create version.json
          $versionJson = @{
            version = "1.0.${{ github.run_number }}"
            buildDate = (Get-Date).ToString("yyyy-MM-ddTHH:mm:ssZ")
            channel = "production"
          } | ConvertTo-Json
          $versionJson | Out-File -Encoding UTF8 dist/RupeeCRM/version.json

          # Package internal application payload
          Compress-Archive -Path dist/RupeeCRM/* -DestinationPath rupeecrm-app-windows-x64.zip -Force

      - name: Build Unified RupeeCRMSetup.msi
        shell: pwsh
        run: |
          # Validate input files before invoking jpackage
          if (-not (Test-Path "dist/RupeeCRM/launcher.jar")) {
              throw "launcher.jar is missing from dist/RupeeCRM"
          }

          if (-not (Test-Path "dist/RupeeCRM/app/rupeecrm.war")) {
              throw "rupeecrm.war is missing from dist/RupeeCRM/app"
          }

          if (-not (Test-Path "dist/RupeeCRM/version.json")) {
              throw "version.json is missing from dist/RupeeCRM"
          }

          # Verify authoritative runner JDK runtime before packaging
          if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {
              throw "Host JDK java.exe is missing from $env:JAVA_HOME\bin"
          }
          if (-not (Test-Path "$env:JAVA_HOME\bin\javaw.exe")) {
              throw "Host JDK javaw.exe is missing from $env:JAVA_HOME\bin"
          }

          Write-Host "=== Verifying Bundled Runtime Execution ==="
          & "$env:JAVA_HOME\bin\java.exe" -version

          # Package Native Application and build standalone MSI Installer with full bundled Temurin runtime
          jpackage --name RupeeCRM `
                   --input dist/RupeeCRM `
                   --main-jar launcher.jar `
                   --main-class com.billing.simple.launcher.LauncherMain `
                   --type msi `
                   --runtime-image "$env:JAVA_HOME" `
                   --icon tools/assets/RupeeCRM.ico `
                   --dest msi-stage `
                   --resource-dir installer/wix/resources `
                   --verbose `
                   --app-version 1.0.${{ github.run_number }} `
                   --vendor "RupeeCRM" `
                   --win-shortcut `
                   --win-menu `
                   --win-menu-group "RupeeCRM" `
                   --win-per-user-install `
                   --win-dir-chooser `
                   --win-upgrade-uuid 4F9E58A2-3670-4A9A-9988-518D1B36C87E `
                   --java-options "-Djava.awt.headless=false"

          $msi = Get-ChildItem "msi-stage" -Filter "*.msi" -File | Select-Object -First 1
          if (-not $msi) {
              throw "jpackage did not produce an MSI in msi-stage"
          }

          Copy-Item $msi.FullName "RupeeCRMSetup.msi" -Force

          if (-not (Test-Path "RupeeCRMSetup.msi")) {
              throw "Final RupeeCRMSetup.msi was not created"
          }

          Write-Host "Created MSI: $((Get-Item RupeeCRMSetup.msi).FullName)"
          Write-Host "Size: $((Get-Item RupeeCRMSetup.msi).Length) bytes"

          # Prepare direct WAR & checksum assets for in-app update pipeline
          Copy-Item app-binaries/rupeecrm.war rupeecrm.war
          Copy-Item app-binaries/rupeecrm.war billsoft.war
          (Get-FileHash -Algorithm SHA256 rupeecrm.war).Hash.ToLower() | Out-File -Encoding ASCII rupeecrm.war.sha256
          (Get-FileHash -Algorithm SHA256 billsoft.war).Hash.ToLower() | Out-File -Encoding ASCII billsoft.war.sha256

      - name: Validate Windows MSI Lifecycle
        shell: pwsh
        run: |
          .\tools\validate-windows-lifecycle.ps1

      - name: Validate Forensic Purge Utility
        shell: pwsh
        run: |
          .\tools\test-purge-script.ps1

      - name: Upload Unsigned CI MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rupeecrm-msi-unsigned-ci
          path: |
            RupeeCRMSetup.msi
            rupeecrm-app-windows-x64.zip
            rupeecrm.war
            rupeecrm.war.sha256
            billsoft.war
            billsoft.war.sha256
          if-no-files-found: error
          retention-days: 3

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-app, build-windows-msi]
    if: needs.build-app.outputs.has_signing_key == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Application Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-binaries
          path: app-binaries

      - name: Download Windows MSI Artifact
        uses: actions/download-artifact@v4
        with:
          name: rupeecrm-msi-unsigned-ci
          path: release-dist

      - name: Generate and Verify Signed Release Manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY || secrets.RELEASE_SIGNING_PRIVATE_KEY || secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p release-meta build-tools

          # Compile ManifestSigner utility into isolated build-tools directory
          javac installer/ManifestSigner.java -d build-tools

          if [ -z "$UPDATE_SIGNING_PRIVATE_KEY" ] || [ -z "$(echo "$UPDATE_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')" ]; then
            echo "CRITICAL SECURITY ERROR: UPDATE_SIGNING_PRIVATE_KEY secret is missing or empty! Releases cannot proceed with unsigned or forged update manifests. Please configure UPDATE_SIGNING_PRIVATE_KEY in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          RELEASE_NOTES="RupeeCRM v1.0.${{ github.run_number }} production release with automated integrity verification."

          # Invoke ManifestSigner using --env to avoid exposing private key on process command-line
          java -cp build-tools com.billing.simple.installer.ManifestSigner sign app-binaries/rupeecrm.war "1.0.${{ github.run_number }}" --env release-meta "$RELEASE_NOTES"

          # Verify signature against pinned production Ed25519 public key
          PUB_KEY="MCowBQYDK2VwAyEAtdG8eJgrX0L7jtx13wOGnqSeeID2B/aRv1+OZQ7v3C8="
          java -cp build-tools com.billing.simple.installer.ManifestSigner verify release-meta/manifest.json release-meta/manifest.sig "$PUB_KEY"

          # Clean up temporary build-tools directory
          rm -rf build-tools

          echo "=== Generated Release Manifest ==="
          cat release-meta/manifest.json
          echo "=== Generated Detached Signature ==="
          cat release-meta/manifest.sig

          cp release-meta/manifest.json release-dist/manifest.json
          cp release-meta/manifest.sig release-dist/manifest.sig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RupeeCRM v1.0.${{ github.run_number }}
          tag_name: v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            release-dist/RupeeCRMSetup.msi
            release-dist/rupeecrm-app-windows-x64.zip
            release-dist/rupeecrm.war
            release-dist/rupeecrm.war.sha256
            release-dist/billsoft.war
            release-dist/billsoft.war.sha256
            release-dist/manifest.json
            release-dist/manifest.sig
          body: |
            ## RupeeCRM v1.0.${{ github.run_number }} Windows Release
            
            ### Installation Instructions
            1. Download **`RupeeCRMSetup.msi`**.
            2. Double-click the installer and follow the normal Windows installation prompts.
            3. RupeeCRM starts automatically in the Windows System Tray.
            4. A notification appears when RupeeCRM is healthy and ready to use.
            
            ### Distribution Assets & Checksums
            - **Unified Installer:** `RupeeCRMSetup.msi`
            - **Direct Update Package:** `rupeecrm.war` (SHA-256: `rupeecrm.war.sha256`)
            - **Legacy Compatible Asset:** `billsoft.war` (SHA-256: `billsoft.war.sha256`)
            - **Release Manifest:** `manifest.json`
            - **Manifest Signature (Ed25519):** `manifest.sig`
            - **Application Payload:** `rupeecrm-app-windows-x64.zip`

  cleanup-old-runs:
    name: Auto-Cleanup Older Workflow Runs
    runs-on: ubuntu-latest
    needs: [build-app, build-windows-msi, publish-release]
    if: always() && needs.build-app.result == 'success' && needs.build-windows-msi.result == 'success' && (needs.publish-release.result == 'success' || needs.publish-release.result == 'skipped')

    steps:
      - name: Purge Older Workflow Runs & Artifacts
        shell: bash
        run: |
          echo "=== Auto-Purging Older Workflow Runs on Successful Build & Release ==="
          CURRENT_RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"

          # 1. Purge older runs of Build and Release (keep current run + 1 previous)
          echo "Fetching runs for Build and Release..."
          RUNS_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/release.yml/runs?per_page=100")

          RUN_IDS_TO_DELETE=$(echo "$RUNS_JSON" | jq -r --arg cur "$CURRENT_RUN_ID" '
            .workflow_runs // []
            | sort_by(.created_at) | reverse
            | [.[] | select((.id|tostring) != $cur)]
            | .[1:]? // []
            | .[]?.id // empty
          ')

          DELETED_COUNT=0
          if [ -n "$RUN_IDS_TO_DELETE" ]; then
            for run_id in $RUN_IDS_TO_DELETE; do
              echo "Deleting old Build and Release run #$run_id..."
              RESP=$(curl -s -w "%{http_code}" -o /dev/null -X DELETE \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/runs/$run_id")
              if [ "$RESP" = "204" ]; then
                DELETED_COUNT=$((DELETED_COUNT + 1))
              fi
            done
          fi
          echo "✓ Purged $DELETED_COUNT older Build and Release runs."

          # 2. Purge older CI regression test runs (keep latest 2 runs)
          echo "Fetching runs for CI Java Regression Tests..."
          TEST_RUNS_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/regression-tests.yml/runs?per_page=100")

          TEST_IDS_TO_DELETE=$(echo "$TEST_RUNS_JSON" | jq -r '
            .workflow_runs // []
            | sort_by(.created_at) | reverse
            | .[2:]? // []
            | .[]?.id // empty
          ')

          TEST_DELETED_COUNT=0
          if [ -n "$TEST_IDS_TO_DELETE" ]; then
            for run_id in $TEST_IDS_TO_DELETE; do
              echo "Deleting old regression test run #$run_id..."
              RESP=$(curl -s -w "%{http_code}" -o /dev/null -X DELETE \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/runs/$run_id")
              if [ "$RESP" = "204" ]; then
                TEST_DELETED_COUNT=$((TEST_DELETED_COUNT + 1))
              fi
            done
          fi
          echo "✓ Purged $TEST_DELETED_COUNT older regression test runs."
          echo "Storage maintenance complete."