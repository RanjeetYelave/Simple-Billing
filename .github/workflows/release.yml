name: Build and Release WAR

on:
  push:
    branches:
      - OTA_update
      - Release-branch

permissions:
  contents: write

jobs:
  build-war:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Update version in application.properties
        working-directory: ./billsoft
        run: |
          sed -i "s/app.version=.*/app.version=v1.0.${{ github.run_number }}/" src/main/resources/application.properties

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Rename WAR file
        working-directory: ./billsoft
        run: cp target/billsoft-0.0.1-SNAPSHOT.war target/billsoft.war

      - name: Generate Checksum
        run: |
          sha256sum billsoft/target/billsoft.war | awk '{print $1}' > billsoft/target/billsoft.war.sha256

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-payload
          path: |
            billsoft/target/billsoft.war
            billsoft/target/billsoft.war.sha256
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Update version in application.properties
        shell: pwsh
        run: |
          (Get-Content billsoft/src/main/resources/application.properties) -replace 'app.version=.*', 'app.version=v1.0.${{ github.run_number }}' | Set-Content billsoft/src/main/resources/application.properties

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Prepare jpackage input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-input
          New-Item -ItemType Directory -Force -Path package-input/runtime
          Copy-Item launcher/target/launcher-0.0.1-SNAPSHOT.jar package-input/launcher.jar
          Copy-Item shell/target/shell-0.0.1-SNAPSHOT.jar package-input/shell.jar
          Copy-Item billsoft/target/billsoft-0.0.1-SNAPSHOT.war package-input/runtime/billsoft.war

      - name: Package Windows Installer
        shell: pwsh
        run: |
          jpackage --name SimpleBilling `
                   --input package-input `
                   --main-jar launcher.jar `
                   --main-class com.billing.simple.launcher.LauncherMain `
                   --type msi `
                   --app-version 1.0.${{ github.run_number }} `
                   --vendor "SimpleBilling" `
                   --win-menu `
                   --win-shortcut `
                   --win-per-user-install

      - name: Locate and Rename MSI
        shell: pwsh
        run: |
          Get-ChildItem -Filter *.msi | Rename-Item -NewName SimpleBillingInstaller.msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: SimpleBillingInstaller.msi
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-war, build-windows]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-payload
          path: ./dist

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: ./dist

      - name: Generate Release Notes
        run: |
          if [ -f billsoft/release-notes.txt ]; then
            cat billsoft/release-notes.txt > release-notes.txt
          else
            echo "## Billsoft Release v1.0.${{ github.run_number }}" > release-notes.txt
            echo "Standard update and improvements." >> release-notes.txt
          fi

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body_path: release-notes.txt
          files: |
            dist/billsoft.war
            dist/billsoft.war.sha256
            dist/SimpleBillingInstaller.msi
          generate_release_notes: false
          fail_on_unmatched_files: true