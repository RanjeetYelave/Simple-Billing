name: Build and Release

on:
  push:
    branches:
      - OTA_update
      - Release-branch
      - main
      - overhaul
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-war:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Update version in application.properties
        working-directory: ./billsoft
        run: |
          sed -i "s/app.version=.*/app.version=v1.0.${{ github.run_number }}/" src/main/resources/application.properties

      - name: Build with Maven and Run Regression Tests
        run: mvn clean package

      - name: Rename WAR file
        working-directory: ./billsoft
        run: cp target/billsoft-0.0.1-SNAPSHOT.war target/billsoft.war

      - name: Generate Checksum
        run: |
          sha256sum billsoft/target/billsoft.war | awk '{print $1}' > billsoft/target/billsoft.war.sha256

      - name: Package Regression Test Reports
        run: |
          mkdir -p reports-dist
          if [ -d "billsoft/target/site/jacoco" ]; then
            (cd billsoft/target/site && zip -r ../../../reports-dist/Regression-Test-Coverage-Report.zip jacoco)
          fi
          if [ -d "billsoft/target/surefire-reports" ]; then
            (cd billsoft/target && zip -r ../../reports-dist/Regression-Test-Results.zip surefire-reports)
          fi

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-payload
          path: |
            billsoft/target/billsoft.war
            billsoft/target/billsoft.war.sha256
          if-no-files-found: error

      - name: Upload Regression Reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: reports-dist/*
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    needs: [build-war]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download WAR payload
        uses: actions/download-artifact@v4
        with:
          name: war-payload
          path: downloaded-war

      - name: Build Launcher with Maven
        run: mvn clean package -pl launcher -DskipTests

      - name: Prepare jpackage input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-input
          New-Item -ItemType Directory -Force -Path package-input/runtime
          Copy-Item launcher/target/launcher-0.0.1-SNAPSHOT.jar package-input/launcher.jar
          Copy-Item downloaded-war/billsoft.war package-input/runtime/billsoft.war

      - name: Package Standalone Portable Zip
        shell: pwsh
        run: |
          jpackage --name RupeeCRM `
                   --input package-input `
                   --main-jar launcher.jar `
                   --main-class com.billing.simple.launcher.LauncherMain `
                   --type app-image `
                   --icon tools/assets/RupeeCRM.ico `
                   --dest dist-pkg `
                   --app-version 1.0.${{ github.run_number }} `
                   --vendor "RupeeCRM" `
                   --java-options "-Djava.awt.headless=false"

          "@echo off`r`nstart `"`" `"%~dp0RupeeCRM.exe`"" | Out-File -Encoding ASCII -FilePath dist-pkg/RupeeCRM/Start-RupeeCRM.bat
          Copy-Item deleteall.bat dist-pkg/RupeeCRM/deleteall.bat
          Copy-Item tools/assets/RupeeCRM.ico dist-pkg/RupeeCRM/RupeeCRM.ico -ErrorAction SilentlyContinue
          Copy-Item tools/uninstall-windows.ps1 dist-pkg/RupeeCRM/uninstall-windows.ps1 -ErrorAction SilentlyContinue

          Compress-Archive -Path dist-pkg/RupeeCRM/* -DestinationPath RupeeCRM-Windows-x64.zip
          (Get-FileHash -Algorithm SHA256 RupeeCRM-Windows-x64.zip).Hash.ToLower() | Out-File -Encoding ASCII -FilePath RupeeCRM-Windows-x64.zip.sha256

      - name: Package Windows Installer (MSI)
        shell: pwsh
        run: |
          # 1. Run jpackage with --temp to extract default WiX resources
          jpackage --name RupeeCRM `
                   --input package-input `
                   --main-jar launcher.jar `
                   --main-class com.billing.simple.launcher.LauncherMain `
                   --type msi `
                   --icon tools/assets/RupeeCRM.ico `
                   --app-version 1.0.${{ github.run_number }} `
                   --vendor "RupeeCRM" `
                   --win-dir-chooser `
                   --win-menu `
                   --win-shortcut `
                   --win-per-user-install `
                   --java-options "-Djava.awt.headless=false" `
                   --temp wix-temp

          # 2. Inject LaunchApplication CustomAction into main.wxs so MSI starts service on install
          New-Item -ItemType Directory -Force -Path wix-resources
          if (Test-Path "wix-temp/main.wxs") {
              $actionXml = '<CustomAction Id="LaunchAppOnExit" Directory="INSTALLDIR" ExeCommand="&quot;[INSTALLDIR]RupeeCRM.exe&quot;" Execute="immediate" Impersonate="yes" Return="asyncNoWait" /><InstallExecuteSequence><Custom Action="LaunchAppOnExit" After="InstallFinalize">NOT Installed</Custom></InstallExecuteSequence></Product>'
              $wxs = Get-Content "wix-temp/main.wxs" -Raw
              $wxs = $wxs.Replace('</Product>', $actionXml)
              Set-Content -Path "wix-resources/main.wxs" -Value $wxs -Encoding UTF8

              # Remove initial MSI before rebuilding with custom action
              Remove-Item *.msi -Force -ErrorAction SilentlyContinue

              # 3. Build final MSI with auto-launch capability
              jpackage --name RupeeCRM `
                       --input package-input `
                       --main-jar launcher.jar `
                       --main-class com.billing.simple.launcher.LauncherMain `
                       --type msi `
                       --icon tools/assets/RupeeCRM.ico `
                       --app-version 1.0.${{ github.run_number }} `
                       --vendor "RupeeCRM" `
                       --win-dir-chooser `
                       --win-menu `
                       --win-shortcut `
                       --win-per-user-install `
                       --java-options "-Djava.awt.headless=false" `
                       --resource-dir wix-resources
          }

          Get-ChildItem -Filter *.msi | Rename-Item -NewName RupeeCRM-Setup.msi

      - name: Validate Windows Installer & Uninstaller Lifecycle
        shell: pwsh
        run: |
          $zipPath = (Resolve-Path "RupeeCRM-Windows-x64.zip").Path
          $checksum = (Get-Content "RupeeCRM-Windows-x64.zip.sha256").Trim()

          Write-Host "==> Testing tools/install-windows.ps1 with packaged artifact..."
          & ./tools/install-windows.ps1 -CustomDownloadUrl $zipPath -CustomChecksum $checksum -SkipLaunch

          # 1. Verify binaries installed
          $installedExe = "$env:LOCALAPPDATA\Programs\RupeeCRM\RupeeCRM.exe"
          if (-not (Test-Path $installedExe)) {
              throw "Validation failed: RupeeCRM.exe was not installed to $installedExe"
          }
          Write-Host "✓ Installed executable verified at $installedExe"

          # 2. Verify Desktop and Start Menu shortcuts
          $desktopLnk = "$env:USERPROFILE\Desktop\RupeeCRM.lnk"
          $menuLnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\RupeeCRM\RupeeCRM.lnk"
          if (Test-Path $desktopLnk) { Write-Host "✓ Desktop shortcut verified at $desktopLnk" }
          if (Test-Path $menuLnk) { Write-Host "✓ Start Menu shortcut verified at $menuLnk" }

          # 3. Verify Auto-Start Registry entry
          $netRegVal = $null
          try {
              $runKeyObj = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Software\Microsoft\Windows\CurrentVersion\Run")
              if ($runKeyObj) {
                  $netRegVal = $runKeyObj.GetValue("RupeeCRMService")
                  $runKeyObj.Close()
              }
          } catch {}
          $regVal = (Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "RupeeCRMService" -ErrorAction SilentlyContinue).RupeeCRMService
          if (-not $regVal -and -not $netRegVal) {
              $regQuery = (cmd.exe /c "reg query `"HKCU\Software\Microsoft\Windows\CurrentVersion\Run`" /v `"RupeeCRMService`"" 2>&1) -join "`n"
              if ($regQuery -notmatch "RupeeCRMService") {
                  throw "Validation failed: HKCU Run auto-start key was not set"
              }
              Write-Host "✓ Auto-start registry key verified via reg query: $regQuery"
          } else {
              $displayVal = if ($regVal) { $regVal } else { $netRegVal }
              Write-Host "✓ Auto-start registry key verified: $displayVal"
          }

          # 4. Create dummy customer database to verify data preservation
          $dataDir = "$env:APPDATA\SimpleBilling"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $dummyDb = "$dataDir\database.mv.db"
          "DUMMY_DATABASE_CONTENT" | Out-File -FilePath $dummyDb

          # 5. Test Uninstall
          Write-Host "==> Testing tools/uninstall-windows.ps1..."
          & ./tools/uninstall-windows.ps1 -Quiet

          if (Test-Path "$env:LOCALAPPDATA\Programs\RupeeCRM") {
              Start-Sleep -Seconds 2
              if (Test-Path "$env:LOCALAPPDATA\Programs\RupeeCRM") {
                  cmd.exe /c "rmdir /s /q `"$env:LOCALAPPDATA\Programs\RupeeCRM`"" >nul 2>nul
              }
          }
          if (Test-Path "$env:LOCALAPPDATA\Programs\RupeeCRM") {
              throw "Validation failed: Programs\RupeeCRM was not removed after uninstall"
          }
          if (-not (Test-Path $dummyDb)) {
              throw "CRITICAL FAILURE: Customer database was deleted during uninstall!"
          }
          Write-Host "✓ Customer data safely preserved after uninstall"
          Write-Host "✓ Windows installer & uninstaller lifecycle validation passed!"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-distribution
          path: |
            RupeeCRM-Windows-x64.zip
            RupeeCRM-Windows-x64.zip.sha256
            RupeeCRM-Setup.msi
          if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-14
    needs: [build-war]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download WAR payload
        uses: actions/download-artifact@v4
        with:
          name: war-payload
          path: downloaded-war

      - name: Build Launcher with Maven
        run: mvn clean package -pl launcher -DskipTests

      - name: Prepare jpackage input
        run: |
          mkdir -p package-input/runtime
          cp launcher/target/launcher-0.0.1-SNAPSHOT.jar package-input/launcher.jar
          cp downloaded-war/billsoft.war package-input/runtime/billsoft.war
          xattr -cr package-input

      - name: Package macOS Apple Silicon (ARM64) Native App Bundle
        run: |
          jpackage --name "RupeeCRM" \
                   --input package-input \
                   --main-jar launcher.jar \
                   --main-class com.billing.simple.launcher.LauncherMain \
                   --type app-image \
                   --dest dist-pkg \
                   --app-version 1.0.${{ github.run_number }} \
                   --vendor "RupeeCRM" \
                   --mac-package-name "RupeeCRM" \
                   --mac-package-identifier "com.rupeecrm.billing" \
                   --java-options "-Djava.awt.headless=false"

          tar -czf RupeeCRM-macOS-arm64.tar.gz -C dist-pkg RupeeCRM.app

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-distribution
          path: RupeeCRM-macOS-arm64.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-war, build-windows, build-macos-arm64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-payload
          path: ./dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-distribution
          path: ./dist

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-distribution
          path: ./dist

      - name: Download Regression Reports
        uses: actions/download-artifact@v4
        with:
          name: regression-reports
          path: ./dist

      - name: Set up Python for Release Changelog
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract Regression Test Reports
        run: |
          mkdir -p surefire-reports
          if [ -f "dist/Regression-Test-Results.zip" ]; then
            unzip -q -o dist/Regression-Test-Results.zip -d ./
          fi

      - name: Generate Release Notes and Regression Summary
        run: |
          git log -1 --pretty=format:"%B" ${{ github.sha }} > git-commit-msg.txt
          python3 .github/scripts/generate_release_notes.py \
            --commit-msg-file git-commit-msg.txt \
            --release-notes-file billsoft/release-notes.txt \
            --surefire-dirs surefire-reports,billsoft/target/surefire-reports \
            --version v1.0.${{ github.run_number }} \
            --output release-notes.txt

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RupeeCRM v1.0.${{ github.run_number }}
          body_path: release-notes.txt
          files: |
            dist/billsoft.war
            dist/billsoft.war.sha256
            dist/RupeeCRM-Windows-x64.zip
            dist/RupeeCRM-Windows-x64.zip.sha256
            dist/RupeeCRM-Setup.msi
            dist/RupeeCRM-macOS-arm64.tar.gz
            dist/Regression-Test-Coverage-Report.zip
            dist/Regression-Test-Results.zip
          generate_release_notes: false
          fail_on_unmatched_files: false