name: Build and Release WAR

on:
  push:
    branches:
      - Release-branch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./billsoft
        run: ./mvnw clean package -DskipTests

      - name: Rename WAR file
        working-directory: ./billsoft
        run: cp target/billsoft-0.0.1-SNAPSHOT.war target/billsoft.war

      - name: Generate Release Notes
        run: |
          echo "## Billsoft Auto Release" > release-notes.txt
          echo "" >> release-notes.txt
          echo "Commit: ${{ github.sha }}" >> release-notes.txt
          echo "Build: ${{ github.run_number }}" >> release-notes.txt
          echo "" >> release-notes.txt
          echo "### Changes in this release:" >> release-notes.txt
          echo "- Auto-generated from commit ${{ github.sha }}" >> release-notes.txt

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body_path: release-notes.txt
          files: |
            billsoft/target/billsoft.war
          generate_release_notes: true
          fail_on_unmatched_files: true