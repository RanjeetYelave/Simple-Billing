name: Build and Release WAR

on:
  push:
    branches:
      - Release-branch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: ./billsoft
        run: chmod +x ./mvnw

      - name: Update version in application.properties
        working-directory: ./billsoft
        run: |
          sed -i "s/app.version=.*/app.version=v1.0.${{ github.run_number }}/" src/main/resources/application.properties

      - name: Build with Maven
        working-directory: ./billsoft
        run: ./mvnw clean package -DskipTests

      - name: Rename WAR file
        working-directory: ./billsoft
        run: cp target/billsoft-0.0.1-SNAPSHOT.war target/billsoft.war

      - name: Generate Release Notes
        run: |
          if [ -f billsoft/release-notes.txt ]; then
            cat billsoft/release-notes.txt > release-notes.txt
          else
            echo "## Billsoft Release v1.0.${{ github.run_number }}" > release-notes.txt
            echo "Standard update and improvements." >> release-notes.txt
          fi

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body_path: release-notes.txt
          files: |
            billsoft/target/billsoft.war
          generate_release_notes: false
          fail_on_unmatched_files: true