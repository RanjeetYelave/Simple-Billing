name: Build and Release

on:
  push:
    branches:
      - main
      - overhaul
      - release/*
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-app:
    runs-on: ubuntu-latest
    outputs:
      has_signing_key: ${{ steps.check-key.outputs.has_key }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Signing Key Availability
        id: check-key
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY || secrets.RELEASE_SIGNING_PRIVATE_KEY || secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_PRIVATE_KEY" ] && [ -n "$(echo "$UPDATE_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Update version in application.properties
        working-directory: ./billsoft
        run: |
          sed -i "s/app.version=.*/app.version=v1.0.${{ github.run_number }}/" src/main/resources/application.properties

      - name: Build Backend and Launcher with Maven
        run: mvn clean package -DskipTests

      - name: Stage Application Binaries
        run: |
          mkdir -p app-binaries
          if [ -f billsoft/target/billsoft-0.0.1-SNAPSHOT.war ]; then
            cp billsoft/target/billsoft-0.0.1-SNAPSHOT.war app-binaries/rupeecrm.war
          elif [ -f billsoft/target/rupeecrm.war ]; then
            cp billsoft/target/rupeecrm.war app-binaries/rupeecrm.war
          else
            echo "CRITICAL: No WAR found in billsoft/target!"
            exit 1
          fi

          if [ -f launcher/target/launcher-0.0.1-SNAPSHOT.jar ]; then
            cp launcher/target/launcher-0.0.1-SNAPSHOT.jar app-binaries/launcher-0.0.1-SNAPSHOT.jar
          else
            echo "CRITICAL: No JAR found in launcher/target!"
            exit 1
          fi

          echo "=== Staged app-binaries directory contents ==="
          ls -lh app-binaries/

      - name: Upload Application Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-binaries
          path: app-binaries/
          if-no-files-found: error
          retention-days: 3

  build-windows-installer:
    name: Build Electron Windows Installer
    runs-on: windows-latest
    needs: [build-app]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Application Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-binaries
          path: app-binaries

      - name: Validate Downloaded Application Binaries
        shell: pwsh
        run: |
          Write-Host "=== Inspecting app-binaries directory ==="
          if (-not (Test-Path "app-binaries/rupeecrm.war") -or -not (Test-Path "app-binaries/launcher-0.0.1-SNAPSHOT.jar")) {
            Write-Error "CRITICAL: Required build artifacts missing from app-binaries!"
            exit 1
          }
          Write-Host "✓ Verified rupeecrm.war ($((Get-Item app-binaries/rupeecrm.war).Length) bytes)"
          Write-Host "✓ Verified launcher jar ($((Get-Item app-binaries/launcher-0.0.1-SNAPSHOT.jar).Length) bytes)"

      - name: Stage Electron Resources and Bundled JRE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/electron/resources
          Copy-Item app-binaries/rupeecrm.war desktop/electron/resources/rupeecrm.war
          Copy-Item app-binaries/launcher-0.0.1-SNAPSHOT.jar desktop/electron/resources/launcher.jar

          # Stage runner's authoritative OpenJDK 21 into resources/jre
          Write-Host "Staging Java 21 JRE from $env:JAVA_HOME into desktop/electron/resources/jre..."
          Copy-Item -Recurse "$env:JAVA_HOME" desktop/electron/resources/jre

          if (-not (Test-Path "desktop/electron/resources/jre/bin/javaw.exe")) {
            throw "Staged JRE is missing bin/javaw.exe!"
          }
          Write-Host "✓ Staged bundled OpenJDK 21 runtime successfully."

      - name: Install Electron Dependencies and Run Tests
        working-directory: ./desktop/electron
        run: |
          npm ci
          npm test

      - name: Build Electron Windows x64 NSIS Installer
        working-directory: ./desktop/electron
        run: |
          npx electron-builder --win --x64

      - name: Verify and Stage Distribution Artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/electron/dist" -Filter "*.exe" | Where-Object { $_.Name -like "*-Setup-*" } | Select-Object -First 1
          if (-not $installer) {
            throw "CRITICAL: electron-builder did not produce a Setup .exe installer in desktop/electron/dist!"
          }

          if ($installer.Length -lt 50MB) {
            throw "CRITICAL: Installer size is unexpectedly small: $($installer.Length) bytes!"
          }

          Write-Host "✓ Verified Windows Setup Installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 2)) MB)"

          New-Item -ItemType Directory -Force -Path release-dist
          Copy-Item $installer.FullName "release-dist/RupeeCRM-Setup.exe" -Force
          Copy-Item $installer.FullName "release-dist/$($installer.Name)" -Force

          # Direct WAR & checksum assets for existing in-app update pipeline
          Copy-Item app-binaries/rupeecrm.war release-dist/rupeecrm.war
          Copy-Item app-binaries/rupeecrm.war release-dist/billsoft.war
          (Get-FileHash -Algorithm SHA256 release-dist/rupeecrm.war).Hash.ToLower() | Out-File -Encoding ASCII release-dist/rupeecrm.war.sha256
          (Get-FileHash -Algorithm SHA256 release-dist/billsoft.war).Hash.ToLower() | Out-File -Encoding ASCII release-dist/billsoft.war.sha256

      - name: Upload Windows Installer and Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rupeecrm-windows-installer
          path: release-dist/
          if-no-files-found: error
          retention-days: 3

  publish-release:
    name: Publish Production GitHub Release
    runs-on: ubuntu-latest
    needs: [build-app, build-windows-installer]
    if: needs.build-app.outputs.has_signing_key == 'true' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Application Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-binaries
          path: app-binaries

      - name: Download Windows Installer Artifacts
        uses: actions/download-artifact@v4
        with:
          name: rupeecrm-windows-installer
          path: release-dist

      - name: Generate and Verify Signed Release Manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY || secrets.RELEASE_SIGNING_PRIVATE_KEY || secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p release-meta build-tools

          # Compile ManifestSigner utility into isolated build-tools directory
          javac installer/ManifestSigner.java -d build-tools

          if [ -z "$UPDATE_SIGNING_PRIVATE_KEY" ] || [ -z "$(echo "$UPDATE_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')" ]; then
            echo "CRITICAL SECURITY ERROR: UPDATE_SIGNING_PRIVATE_KEY secret is missing or empty! Releases cannot proceed with unsigned or forged update manifests. Please configure UPDATE_SIGNING_PRIVATE_KEY in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          RELEASE_NOTES="RupeeCRM v1.0.${{ github.run_number }} production release with automated integrity verification."

          # Invoke ManifestSigner using --env to avoid exposing private key on process command-line
          java -cp build-tools com.billing.simple.installer.ManifestSigner sign app-binaries/rupeecrm.war "1.0.${{ github.run_number }}" --env release-meta "$RELEASE_NOTES"

          # Verify signature against pinned production Ed25519 public key
          PUB_KEY="MCowBQYDK2VwAyEAtdG8eJgrX0L7jtx13wOGnqSeeID2B/aRv1+OZQ7v3C8="
          java -cp build-tools com.billing.simple.installer.ManifestSigner verify release-meta/manifest.json release-meta/manifest.sig "$PUB_KEY"

          # Clean up temporary build-tools directory
          rm -rf build-tools

          echo "=== Generated Release Manifest ==="
          cat release-meta/manifest.json
          echo "=== Generated Detached Signature ==="
          cat release-meta/manifest.sig

          cp release-meta/manifest.json release-dist/manifest.json
          cp release-meta/manifest.sig release-dist/manifest.sig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RupeeCRM v1.0.${{ github.run_number }}
          tag_name: v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            release-dist/*.exe
            release-dist/rupeecrm.war
            release-dist/rupeecrm.war.sha256
            release-dist/billsoft.war
            release-dist/billsoft.war.sha256
            release-dist/manifest.json
            release-dist/manifest.sig
          body: |
            ## RupeeCRM v1.0.${{ github.run_number }} Windows Release
            
            ### Installation Instructions
            1. Download **`RupeeCRM-Setup.exe`**.
            2. Run the installer wizard and complete installation (per-user installation, no admin privileges required).
            3. RupeeCRM launches and docks cleanly into the Windows System Tray.
            
            ### Distribution Assets & Checksums
            - **Unified Electron Installer:** `RupeeCRM-Setup.exe`
            - **Direct Update Package:** `rupeecrm.war` (SHA-256: `rupeecrm.war.sha256`)
            - **Legacy Compatible Asset:** `billsoft.war` (SHA-256: `billsoft.war.sha256`)
            - **Release Manifest:** `manifest.json`
            - **Manifest Signature (Ed25519):** `manifest.sig`

  cleanup-old-runs:
    name: Auto-Cleanup Older Workflow Runs
    runs-on: ubuntu-latest
    needs: [build-app, build-windows-installer, publish-release]
    if: always() && needs.build-app.result == 'success' && needs.build-windows-installer.result == 'success' && (needs.publish-release.result == 'success' || needs.publish-release.result == 'skipped')

    steps:
      - name: Purge Older Workflow Runs & Artifacts
        shell: bash
        run: |
          echo "=== Auto-Purging Older Workflow Runs on Successful Build & Release ==="
          CURRENT_RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"

          # 1. Purge older runs of Build and Release (keep current run + 1 previous)
          echo "Fetching runs for Build and Release..."
          RUNS_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/release.yml/runs?per_page=100")

          RUN_IDS_TO_DELETE=$(echo "$RUNS_JSON" | jq -r --arg cur "$CURRENT_RUN_ID" '
            .workflow_runs // []
            | sort_by(.created_at) | reverse
            | [.[] | select((.id|tostring) != $cur)]
            | .[1:]? // []
            | .[]?.id // empty
          ')

          DELETED_COUNT=0
          if [ -n "$RUN_IDS_TO_DELETE" ]; then
            for run_id in $RUN_IDS_TO_DELETE; do
              echo "Deleting old Build and Release run #$run_id..."
              RESP=$(curl -s -w "%{http_code}" -o /dev/null -X DELETE \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/runs/$run_id")
              if [ "$RESP" = "204" ]; then
                DELETED_COUNT=$((DELETED_COUNT + 1))
              fi
            done
          fi
          echo "✓ Purged $DELETED_COUNT older Build and Release runs."

          # 2. Purge older CI regression test runs (keep latest 2 runs)
          echo "Fetching runs for CI Java Regression Tests..."
          TEST_RUNS_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/regression-tests.yml/runs?per_page=100")

          TEST_IDS_TO_DELETE=$(echo "$TEST_RUNS_JSON" | jq -r '
            .workflow_runs // []
            | sort_by(.created_at) | reverse
            | .[2:]? // []
            | .[]?.id // empty
          ')

          TEST_DELETED_COUNT=0
          if [ -n "$TEST_IDS_TO_DELETE" ]; then
            for run_id in $TEST_IDS_TO_DELETE; do
              echo "Deleting old regression test run #$run_id..."
              RESP=$(curl -s -w "%{http_code}" -o /dev/null -X DELETE \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/runs/$run_id")
              if [ "$RESP" = "204" ]; then
                TEST_DELETED_COUNT=$((TEST_DELETED_COUNT + 1))
              fi
            done
          fi
          echo "✓ Purged $TEST_DELETED_COUNT older regression test runs."
          echo "Storage maintenance complete."