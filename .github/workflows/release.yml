name: Build and Release

on:
  push:
    branches:
      - OTA_update
      - Release-branch
      - main
      - overhaul
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-war:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Update version in application.properties
        working-directory: ./billsoft
        run: |
          sed -i "s/app.version=.*/app.version=v1.0.${{ github.run_number }}/" src/main/resources/application.properties

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Rename WAR file
        working-directory: ./billsoft
        run: cp target/billsoft-0.0.1-SNAPSHOT.war target/billsoft.war

      - name: Generate Checksum
        run: |
          sha256sum billsoft/target/billsoft.war | awk '{print $1}' > billsoft/target/billsoft.war.sha256

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-payload
          path: |
            billsoft/target/billsoft.war
            billsoft/target/billsoft.war.sha256
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Update version in application.properties
        shell: pwsh
        run: |
          (Get-Content billsoft/src/main/resources/application.properties) -replace 'app.version=.*', 'app.version=v1.0.${{ github.run_number }}' | Set-Content billsoft/src/main/resources/application.properties

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Prepare jpackage input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-input
          New-Item -ItemType Directory -Force -Path package-input/runtime
          Copy-Item launcher/target/launcher-0.0.1-SNAPSHOT.jar package-input/launcher.jar
          Copy-Item billsoft/target/billsoft-0.0.1-SNAPSHOT.war package-input/runtime/billsoft.war

      - name: Package Standalone Portable Zip
        shell: pwsh
        run: |
          jpackage --name RupeeCRM `
                   --input package-input `
                   --main-jar launcher.jar `
                   --main-class com.billing.simple.launcher.LauncherMain `
                   --type app-image `
                   --dest dist-pkg `
                   --app-version 1.0.${{ github.run_number }} `
                   --vendor "RupeeCRM" `
                   --java-options "-Djava.awt.headless=false"

          "@echo off`r`nstart `"`" `"%~dp0RupeeCRM.exe`"" | Out-File -Encoding ASCII -FilePath dist-pkg/RupeeCRM/Start-RupeeCRM.bat
          Copy-Item deleteall.bat dist-pkg/RupeeCRM/deleteall.bat

          Compress-Archive -Path dist-pkg/RupeeCRM/* -DestinationPath RupeeCRM-Windows-x64.zip

      - name: Package Windows Installer (MSI)
        shell: pwsh
        run: |
          # 1. Run jpackage with --temp to extract default WiX resources
          jpackage --name RupeeCRM `
                   --input package-input `
                   --main-jar launcher.jar `
                   --main-class com.billing.simple.launcher.LauncherMain `
                   --type msi `
                   --app-version 1.0.${{ github.run_number }} `
                   --vendor "RupeeCRM" `
                   --win-menu `
                   --win-shortcut `
                   --win-per-user-install `
                   --java-options "-Djava.awt.headless=false" `
                   --temp wix-temp

          # 2. Inject LaunchApplication CustomAction into main.wxs so MSI starts service on install
          New-Item -ItemType Directory -Force -Path wix-resources
          if (Test-Path "wix-temp/main.wxs") {
              $customAction = @"
    <CustomAction Id="LaunchAppOnExit" Directory="INSTALLDIR" ExeCommand="`"[INSTALLDIR]RupeeCRM.exe`"" Execute="immediate" Impersonate="yes" Return="asyncNoWait" />
    <InstallExecuteSequence>
      <Custom Action="LaunchAppOnExit" After="InstallFinalize">NOT Installed</Custom>
    </InstallExecuteSequence>
  </Product>
"@
              $wxs = Get-Content "wix-temp/main.wxs" -Raw
              $wxs = $wxs -replace '</Product>', $customAction
              Set-Content -Path "wix-resources/main.wxs" -Value $wxs -Encoding UTF8

              # Remove initial MSI before rebuilding with custom action
              Remove-Item *.msi -Force -ErrorAction SilentlyContinue

              # 3. Build final MSI with auto-launch capability
              jpackage --name RupeeCRM `
                       --input package-input `
                       --main-jar launcher.jar `
                       --main-class com.billing.simple.launcher.LauncherMain `
                       --type msi `
                       --app-version 1.0.${{ github.run_number }} `
                       --vendor "RupeeCRM" `
                       --win-menu `
                       --win-shortcut `
                       --win-per-user-install `
                       --java-options "-Djava.awt.headless=false" `
                       --resource-dir wix-resources
          }

          Get-ChildItem -Filter *.msi | Rename-Item -NewName RupeeCRM-Setup.msi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-distribution
          path: |
            RupeeCRM-Windows-x64.zip
            RupeeCRM-Setup.msi
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-war, build-windows]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-payload
          path: ./dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-distribution
          path: ./dist

      - name: Generate Release Notes
        run: |
          if [ -f billsoft/release-notes.txt ]; then
            cat billsoft/release-notes.txt > release-notes.txt
          else
            echo "## RupeeCRM Release v1.0.${{ github.run_number }}" > release-notes.txt
            echo "Professional CRM and billing background service with custom offline domain and bundled JRE." >> release-notes.txt
          fi

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RupeeCRM v1.0.${{ github.run_number }}
          body_path: release-notes.txt
          files: |
            dist/billsoft.war
            dist/billsoft.war.sha256
            dist/RupeeCRM-Windows-x64.zip
            dist/RupeeCRM-Setup.msi
          generate_release_notes: false
          fail_on_unmatched_files: true