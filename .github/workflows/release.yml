name: Build and Release

on:
  push:
    branches:
      - main
      - overhaul
      - release/*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Update version in application.properties
        working-directory: ./billsoft
        run: |
          sed -i "s/app.version=.*/app.version=v1.0.${{ github.run_number }}/" src/main/resources/application.properties

      - name: Build Backend and Launcher with Maven
        run: mvn clean package -DskipTests

      - name: Stage Application Binaries
        run: |
          mkdir -p app-binaries
          if [ -f billsoft/target/billsoft-0.0.1-SNAPSHOT.war ]; then
            cp billsoft/target/billsoft-0.0.1-SNAPSHOT.war app-binaries/rupeecrm.war
          elif [ -f billsoft/target/rupeecrm.war ]; then
            cp billsoft/target/rupeecrm.war app-binaries/rupeecrm.war
          else
            echo "CRITICAL: No WAR found in billsoft/target!"
            exit 1
          fi

          if [ -f launcher/target/launcher-0.0.1-SNAPSHOT.jar ]; then
            cp launcher/target/launcher-0.0.1-SNAPSHOT.jar app-binaries/launcher-0.0.1-SNAPSHOT.jar
          else
            echo "CRITICAL: No JAR found in launcher/target!"
            exit 1
          fi

          echo "=== Staged app-binaries directory contents ==="
          ls -lh app-binaries/

      - name: Upload Application Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-binaries
          path: app-binaries/
          if-no-files-found: error

  build-windows-msi:
    runs-on: windows-latest
    needs: [build-app]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download Application Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-binaries
          path: app-binaries

      - name: Validate Downloaded Application Binaries
        shell: pwsh
        run: |
          Write-Host "=== Inspecting app-binaries directory ==="
          if (Test-Path app-binaries) {
            Get-ChildItem -Recurse app-binaries | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Error "CRITICAL: app-binaries directory does not exist!"
            exit 1
          }

          $requiredFiles = @(
            "app-binaries/rupeecrm.war",
            "app-binaries/launcher-0.0.1-SNAPSHOT.jar"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "CRITICAL: Required build artifact '$file' is missing!"
              exit 1
            } else {
              $size = (Get-Item $file).Length
              if ($size -le 1024) {
                Write-Error "CRITICAL: Artifact '$file' is empty or corrupted (size: $size bytes)!"
                exit 1
              }
              Write-Host "✓ Verified artifact: $file ($size bytes)"
            }
          }

      - name: Install WiX Toolset v4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5

      - name: Prepare Application Packaging Layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/RupeeCRM/app
          New-Item -ItemType Directory -Force -Path dist/RupeeCRM/jre

          # Copy backend WAR
          Copy-Item app-binaries/rupeecrm.war dist/RupeeCRM/app/rupeecrm.war

          # Copy Launcher/Supervisor JAR
          Copy-Item app-binaries/launcher-0.0.1-SNAPSHOT.jar dist/RupeeCRM/launcher.jar

          # Create version.json
          $versionJson = @{
            version = "1.0.${{ github.run_number }}"
            buildDate = (Get-Date).ToString("yyyy-MM-ddTHH:mm:ssZ")
            channel = "production"
          } | ConvertTo-Json
          $versionJson | Out-File -Encoding UTF8 dist/RupeeCRM/version.json

          # Copy minimal bundled JRE from runner JDK
          Copy-Item -Recurse "$env:JAVA_HOME\bin", "$env:JAVA_HOME\lib", "$env:JAVA_HOME\conf" dist/RupeeCRM/jre/

          # Package internal application payload
          Compress-Archive -Path dist/RupeeCRM/* -DestinationPath rupeecrm-app-windows-x64.zip -Force

      - name: Generate Release Manifest and Ed25519 Signature
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_ED25519_PRIVATE_KEY }}
        run: |
          # Use placeholder if secret not set in fork/pr
          $privKey = if ($env:RELEASE_SIGNING_KEY) { $env:RELEASE_SIGNING_KEY } else { "MC4CAQAwBQYDK2VwBCIEIPkU6f4xW9j9m+7R6iP6X9Y6bZ+1w8vX7q3m8r5t8v9x" }
          javac installer/ManifestSigner.java
          java -cp installer com.billing.simple.installer.ManifestSigner sign rupeecrm-app-windows-x64.zip "1.0.${{ github.run_number }}" $privKey ./release-meta

      - name: Build Unified RupeeCRMSetup.msi
        shell: pwsh
        run: |
          Copy-Item tools/assets/RupeeCRM.ico installer/wix/RupeeCRM.ico -ErrorAction SilentlyContinue

          # Package Native Launcher Executable
          jpackage --name RupeeCRM `
                   --input dist/RupeeCRM `
                   --main-jar launcher.jar `
                   --main-class com.billing.simple.launcher.LauncherMain `
                   --type app-image `
                   --icon tools/assets/RupeeCRM.ico `
                   --dest msi-stage `
                   --app-version 1.0.${{ github.run_number }} `
                   --vendor "RupeeCRM" `
                   --java-options "-Djava.awt.headless=false"

          # Prepare MSI staging payload
          New-Item -ItemType Directory -Force -Path installer/wix/payload
          Copy-Item -Recurse msi-stage/RupeeCRM/* installer/wix/payload/

          # Build MSI with WiX v4
          wix build -o RupeeCRMSetup.msi installer/wix/RupeeCRMSetup.wxs

          # Prepare direct WAR & checksum assets for in-app update pipeline
          Copy-Item app-binaries/rupeecrm.war rupeecrm.war
          Copy-Item app-binaries/rupeecrm.war billsoft.war
          (Get-FileHash -Algorithm SHA256 rupeecrm.war).Hash.ToLower() | Out-File -Encoding ASCII rupeecrm.war.sha256
          (Get-FileHash -Algorithm SHA256 billsoft.war).Hash.ToLower() | Out-File -Encoding ASCII billsoft.war.sha256

      - name: Upload Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            RupeeCRMSetup.msi
            rupeecrm-app-windows-x64.zip
            rupeecrm.war
            rupeecrm.war.sha256
            billsoft.war
            billsoft.war.sha256
            release-meta/manifest.json
            release-meta/manifest.sig
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows-msi]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Release Assets
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: release-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RupeeCRM v1.0.${{ github.run_number }}
          tag_name: v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            release-dist/RupeeCRMSetup.msi
            release-dist/rupeecrm-app-windows-x64.zip
            release-dist/rupeecrm.war
            release-dist/rupeecrm.war.sha256
            release-dist/billsoft.war
            release-dist/billsoft.war.sha256
            release-dist/manifest.json
            release-dist/manifest.sig
          body: |
            ## RupeeCRM v1.0.${{ github.run_number }} Windows Release
            
            ### Installation Instructions
            1. Download **`RupeeCRMSetup.msi`**.
            2. Double-click to install.
            3. RupeeCRM will start automatically in the Windows System Tray and open your dashboard.
            
            ### Integrity & Authenticity
            - Release Manifest: `manifest.json` (signed via Ed25519: `manifest.sig`)
            - Application Payload: `rupeecrm-app-windows-x64.zip` (verified by MSI)