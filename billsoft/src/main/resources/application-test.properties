spring.datasource.url=jdbc:h2:mem:billsoftdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
logging.level.org.hibernate.SQL=DEBUG

spring.jpa.properties.hibernate.format_sql=false

# Disable web environment in tests (prevents ServletTestExecutionListener errors)
spring.main.web-application-type=none

# Prevent Spring Boot from starting Tomcat during tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.ServletWebServerFactoryAutoConfiguration

# Ensure entity scanning works properly
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=create
