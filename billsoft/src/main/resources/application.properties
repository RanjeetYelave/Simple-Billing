spring.application.name=billsoft
spring.datasource.url=jdbc:h2:file:${RUPEECRM_DATA_DIR:${BILLSOFT_DATA_DIR:~/.rupeecrm/data}}/database;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
server.port=28080
server.address=127.0.0.1
app.version=v1.0.0

# Fix Hibernate lazy loading serialization issues
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# H2 Console disabled in production for security
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Multipart Upload Limits (support large multi-firm database backups, documents, and logos)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB