                  React.createElement('span', { style: { fontSize: '0.8rem', color: 'var(--text-secondary)' } }, `${salaries.length} record${salaries.length !== 1 ? 's' : ''}`)
                ),
                React.createElement('div', { className: 'card-body', style: { padding: 0 } },
                  salaries.length === 0 ? React.createElement('div', { style: { padding: 20, textAlign: 'center', color: 'var(--text-secondary)' } }, 'No salary history.') :
                  salaries.map(s => React.createElement('div', { key: s.id, style: { padding: '12px 16px', borderBottom: '1px solid var(--border)' } },
                    React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', marginBottom: 4 } },
                      React.createElement('strong', null, s.monthYear),
                      React.createElement('strong', { style: { color: 'var(--success)' } }, BillsoftUtils.formatCurrency(s.netPaid))
                    ),
                    React.createElement('div', { style: { fontSize: '0.85rem', color: 'var(--text-secondary)' } }, `Paid on ${BillsoftUtils.formatDate(s.paymentDate)}`),
                    React.createElement('div', { style: { fontSize: '0.85rem', color: 'var(--text-secondary)', display: 'flex', gap: 8, marginTop: 4, flexWrap: 'wrap', alignItems: 'center' } },
                      s.leaveDeductionAmount > 0 && React.createElement('span', { className: 'badge', style: { backgroundColor: 'var(--danger)', color: 'white' } }, `-${BillsoftUtils.formatCurrency(s.leaveDeductionAmount)} Absences`),
                      s.bonusAmount > 0 && React.createElement('span', { className: 'badge', style: { backgroundColor: 'var(--success)', color: 'white' } }, `+${BillsoftUtils.formatCurrency(s.bonusAmount)} Bonus`),
                      s.advanceDeducted > 0 && React.createElement('span', { className: 'badge' }, `-${BillsoftUtils.formatCurrency(s.advanceDeducted)} Adv`),
                      React.createElement('button', { className: 'btn btn-sm btn-ghost', title: 'Download Payslip', onClick: () => handleDownloadPayslip(s.id), style: { marginLeft: 'auto', fontSize: '0.75rem' } }, Icons.download, ' Payslip')
                    )
                  ))
                )
              )
            ),

            // Rejoin Modal (previously missing from UI)
            showRejoinModal && React.createElement('div', { className: 'modal-overlay', onClick: () => setShowRejoinModal(false) },
              React.createElement('div', { className: 'modal', onClick: e => e.stopPropagation() },
                React.createElement('div', { className: 'modal-header' }, React.createElement('div', { className: 'modal-title' }, '🟢 Rejoin Employee'), React.createElement('button', { className: 'modal-close', onClick: () => setShowRejoinModal(false) }, '✕')),
                React.createElement('div', { className: 'modal-body' },
                  React.createElement('form', { onSubmit: e => { e.preventDefault(); handleRejoinConfirm(); }, style: { display: 'flex', flexDirection: 'column', gap: 16 } },
                    React.createElement('div', { className: 'form-group' }, React.createElement('label', { className: 'form-label' }, 'Date of Rejoining *'), React.createElement('input', { className: 'input', type: 'date', value: rejoinData.dateOfJoining, onChange: e => setRejoinData({...rejoinData, dateOfJoining: e.target.value}), required: true })),
                    React.createElement('div', { className: 'form-group' }, React.createElement('label', { className: 'form-label' }, 'New Salary (₹) *'), React.createElement('input', { className: 'input', type: 'number', value: rejoinData.monthlyBaseSalary, onChange: e => setRejoinData({...rejoinData, monthlyBaseSalary: e.target.value}), required: true })),
                    React.createElement('div', { className: 'form-group' }, React.createElement('label', { className: 'form-label' }, 'New Role'), React.createElement('input', { className: 'input', value: rejoinData.role, onChange: e => setRejoinData({...rejoinData, role: e.target.value}) })),
                    React.createElement('p', { style: { color: 'var(--text-secondary)', fontSize: '0.85rem' } }, 'This will be recorded as a rejoin event in the employee timeline with updated details.'),
                    React.createElement('button', { type: 'submit', className: 'btn btn-success', style: { backgroundColor: '#16a34a', color: 'white' } }, 'Confirm Rejoin')
                  )

    // ─── INVOICE / QUOTATION VIEW ───
    function InvoiceQuotationView({ tab, onTabChange, onEditInvoice, onEditQuotation, onConvertToInvoice }) {
      const pillStyle = (isActive) => ({
        padding: '6px 20px',
        border: 'none',
        background: isActive ? 'var(--primary)' : '#f1f5f9',
        color: isActive ? 'white' : 'var(--text-secondary)',
        borderRadius: '20px',
        cursor: 'pointer',
        fontWeight: isActive ? 600 : 400,
        fontSize: '0.85rem',
        transition: 'all 0.15s ease'
      });
      return React.createElement(Fragment, null,
        React.createElement('div', { style: { display: 'flex', gap: 8, alignItems: 'center', marginBottom: 20 } },
          React.createElement('button', { style: pillStyle(tab === 'invoices'), onClick: () => onTabChange('invoices') }, 'Invoices'),
          React.createElement('button', { style: pillStyle(tab === 'quotations'), onClick: () => onTabChange('quotations') }, 'Quotations')
        ),
        tab === 'invoices' 
          ? React.createElement(InvoiceList, { onEditInvoice }) 
          : React.createElement(QuotationList, { onEditQuotation, onConvertToInvoice })
      );
    }

    // ─── CREATE INVOICE / QUOTATION TABS ───
    function CreateTabView() {
      const [tabs, setTabs] = useState([]);
      const [activeTab, setActiveTab] = useState(null);
      const tabsRef = useRef(tabs);
      tabsRef.current = tabs;
      const activeTabRef = useRef(activeTab);
      activeTabRef.current = activeTab;
      const addTab = (type) => {
        if (tabs.length >= 10) { showToast('Maximum 10 tabs allowed', 'warning'); return; }
        const count = tabs.filter(t => t.type === type).length + 1;
        const label = type === 'invoice' ? `Inv ${count}` : `Qtn ${count}`;
        const newTab = { id: Date.now() + Math.random(), type, label };
        setTabs(prev => [...prev, newTab]);
        setActiveTab(newTab.id);
      };
      const closeTab = (id, e) => {
        e.stopPropagation();
        setTabs(prev => {
          const remaining = prev.filter(t => t.id !== id);
          if (id === activeTabRef.current) {
            if (remaining.length > 0) {
              const idx = prev.findIndex(t => t.id === id);
              const newActiveIdx = Math.min(idx, remaining.length - 1);
              setActiveTab(remaining[newActiveIdx].id);
            } else {
              setActiveTab(null);
            }
          }
          return remaining;
        });
      };
      const currentTab = tabs.find(t => t.id === activeTab);
      return React.createElement('div', null,
        React.createElement('div', { className: 'create-toolbar' },
          React.createElement('span', { className: 'create-label' }, 'Create:'),
          React.createElement('button', { className: 'btn btn-sm btn-primary', onClick: () => addTab('invoice') }, '+ Invoice'),
          React.createElement('button', { className: 'btn btn-sm btn-outline', onClick: () => addTab('quotation') }, '+ Quotation'),
          React.createElement('span', { className: 'tab-counter' }, `${tabs.length}/10`)
        ),
        tabs.length === 0 && React.createElement('div', { className: 'empty-state' },
          React.createElement('h3', null, 'No open documents'),
          React.createElement('p', null, 'Click "+ Invoice" or "+ Quotation" to start creating.')
        ),
        tabs.length > 0 && React.createElement('div', { className: 'chrome-tab-bar' },
          tabs.map(t => React.createElement('div', { key: t.id, className: `chrome-tab${activeTab === t.id ? ' active' : ''}`, onClick: () => setActiveTab(t.id) },
            React.createElement('span', { className: 'tab-icon' }, t.type === 'invoice' ? '📄' : '📋'),
            React.createElement('span', { className: 'tab-label' }, t.label),
            React.createElement('span', { className: 'tab-close', onClick: (e) => closeTab(t.id, e) }, '✕')
          ))
        ),
        currentTab && React.createElement('div', { key: currentTab.id },
          React.createElement(InvoiceForm, { editId: null, isQuotationMode: currentTab.type === 'quotation', onSaved: () => { 
            showToast(currentTab.type === 'invoice' ? 'Invoice created!' : 'Quotation created!', 'success');
            const id = currentTab.id;
            setTabs(prev => {
              const remaining = prev.filter(t => t.id !== id);
              if (id === activeTabRef.current) {
                if (remaining.length > 0) {
                  const idx = prev.findIndex(t => t.id === id);
                  const newActiveIdx = Math.min(idx, remaining.length - 1);
                  setActiveTab(remaining[newActiveIdx].id);
                } else {
                  setActiveTab(null);
                }
              }
              return remaining;
            });
          } })
        )
      );
    }

    // ─── MAIN APP ───
    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(localStorage.getItem('isAuthenticated') === 'true');
      const [appLoaded, setAppLoaded] = useState(false);
      const [authEnabled, setAuthEnabled] = useState(false);
      const [page, setPage] = useState('dashboard');
      const [editInvoiceId, setEditInvoiceId] = useState(null);
      const [editQuotationId, setEditQuotationId] = useState(null);
      const [convertedFromQuotationId, setConvertedFromQuotationId] = useState(null);
      const [firmName, setFirmName] = useState('');
      const [firms, setFirms] = useState([]);
      const [toasts, setToasts] = useState([]);
      const [firmLoadKey, setFirmLoadKey] = useState(0);

      useEffect(() => {
        API.auth.status().then(res => { setAuthEnabled(res.authEnabled); if (!res.authEnabled) setIsAuthenticated(true); setAppLoaded(true); }).catch(() => setAppLoaded(true));
      }, []);

      const handleLogin = (firmId) => { setIsAuthenticated(true); localStorage.setItem('isAuthenticated', 'true'); if (firmId) API.firmId = firmId; setFirmLoadKey(k => k + 1); };
      const handleLogout = () => { setIsAuthenticated(false); localStorage.removeItem('isAuthenticated'); API.firmId = null; setFirmName(''); setFirms([]); window.showToast('Logged out successfully', 'success'); };
      window.showToast = (message, type = 'info') => { const id = BillsoftUtils.generateId(); setToasts(t => [...t, { id, message, type }]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4000); };
      const removeToast = (id) => setToasts(t => t.filter(x => x.id !== id));
      const loadFirms = () => {
        API.firm.list().then(list => {
          setFirms(list);
          const savedId = API.firmId;
          if (list.length === 0) { return API.firm.create().then(f => { API.firmId = f.id; setFirms([f]); if (f.firmName) setFirmName(f.firmName); showToast('Default firm created', 'info'); }); }
          if (!savedId) API.firmId = list[0].id;
          const currentId = API.firmId;
          if (currentId) { const firm = list.find(f => f.id === currentId); if (firm && firm.firmName) setFirmName(firm.firmName); }
        }).catch(() => {});
      };
      useEffect(() => { loadFirms(); }, [firmLoadKey]);
      const refreshFirm = () => {
        const currentId = API.firmId;
        if (currentId) { API.firm.get(currentId).then(f => { if (f && f.firmName) setFirmName(f.firmName); API.firm.list().then(list => setFirms(list)).catch(() => {}); }).catch(() => {}); }
      };
      const handleFirmSwitch = (firmId) => {
        const prevId = API.firmId;
        if (firmId === prevId) return;
        API.firmId = firmId;
        API.firm.get(firmId).then(f => { if (f && f.firmName) setFirmName(f.firmName); }).catch(() => {});
        API.firm.list().then(list => setFirms(list)).catch(() => {});
        showToast('Switched firm', 'success');
      };
      const navigate = (p) => {
        setPage(p);
        if (p !== 'new-invoice') setEditInvoiceId(null);
        if (p !== 'new-quotation') { setEditQuotationId(null); setConvertedFromQuotationId(null); }
      };
      const handleEditInvoice = (id) => { setEditInvoiceId(id); setEditQuotationId(null); setConvertedFromQuotationId(null); setPage('new-invoice'); };
      const handleEditQuotation = (id) => { setEditQuotationId(id); setEditInvoiceId(null); setConvertedFromQuotationId(null); setPage('new-quotation'); };
      const handleConvertToInvoice = (quotation) => {
        setEditInvoiceId(quotation.id);
        setEditQuotationId(null);
        setConvertedFromQuotationId(quotation.id);
        setPage('new-invoice');
        showToast('Edit quotation details and save to convert', 'info');
      };
      const handleSaved = () => {
        setEditInvoiceId(null);
        if (convertedFromQuotationId) {
          setPage('quotations');
          setConvertedFromQuotationId(null);
          showToast('Quotation converted to invoice successfully', 'success');
        } else {
          setPage(editQuotationId ? 'quotations' : 'invoices');
          setEditQuotationId(null);
        }
      };
      const handleQuotationSaved = () => {
        setEditQuotationId(null);
        setPage('quotations');
      };
      const handleFirmChanged = () => { refreshFirm(); setFirmLoadKey(k => k + 1); };

      const [isUpdating, setIsUpdating] = useState(false);
      const [updateCompleteBanner, setUpdateCompleteBanner] = useState(null);
      useEffect(() => {
        API._json('/api/system/check-update-complete').then(res => { if (res && res.justUpdated) setUpdateCompleteBanner(res.updatedVersion || true); }).catch(() => {});
      }, []);
      const [updateProgress, setUpdateProgress] = useState(null);
      const updatePollRef = useRef(null);
      const connectUpdateProgressSSE = () => {
        if (updatePollRef.current) { updatePollRef.current.close(); updatePollRef.current = null; }
        const source = new EventSource(API.BASE_URL + '/api/system/update-progress');
        updatePollRef.current = source;
        source.addEventListener('progress', e => { try { const data = JSON.parse(e.data); setUpdateProgress(data); if (data.status === 'complete' || data.status === 'error') { source.close(); updatePollRef.current = null; } } catch (err) {} });
        source.onerror = () => { setUpdateProgress(prev => { if (prev && (prev.status === 'downloading' || prev.status === 'installing')) { return { ...prev, status: 'restarting', message: 'Restarting application...', percent: 100 }; } return prev; }); };
        return new Promise(resolve => setTimeout(resolve, 2000));
      };
      const handleStartUpdate = async (latestVersion) => {
        setIsUpdating(true);
        setUpdateProgress({ status: 'downloading', percent: 0, message: 'Starting download...', latestVersion: latestVersion || '' });
        if (window.electron && window.electron.setUpdating) window.electron.setUpdating();
        await connectUpdateProgressSSE();
        try { await API.system.applyUpdate(); } catch (e) { setUpdateProgress({ status: 'error', percent: 0, message: 'Update failed: ' + (e.message || 'Unknown error'), latestVersion: latestVersion || '' }); }
      };
      const handleUpdateComplete = () => { setIsUpdating(false); setUpdateProgress(null); if (updatePollRef.current) { updatePollRef.current.close(); updatePollRef.current = null; } };

      const [invoiceTab, setInvoiceTab] = useState('invoices'); // invoices | quotations

      const pageComponents = {
        dashboard: { title: 'Dashboard', comp: React.createElement(Dashboard, { key: API.firmId, onStartUpdate: handleStartUpdate }) },
        invoices: { title: 'Invoices & Quotations', comp: React.createElement(InvoiceQuotationView, { key: API.firmId, tab: invoiceTab, onTabChange: setInvoiceTab, onEditInvoice: handleEditInvoice, onEditQuotation: handleEditQuotation, onConvertToInvoice: handleConvertToInvoice }) },
        create: { title: 'Create Invoice/Quotation', comp: React.createElement(CreateTabView, { key: API.firmId }) },
        products: { title: 'Products', comp: React.createElement(ProductManager, { key: API.firmId }) },
        customers: { title: 'Customers', comp: React.createElement(CustomerManager, { key: API.firmId }) },
        employees: { title: 'Employees', comp: React.createElement(EmployeeManager, { key: API.firmId }) },
        firm: { title: 'Firm Profile', comp: React.createElement(FirmProfile, { key: API.firmId, onFirmChanged: handleFirmChanged }) },
        statements: { title: 'Statements', comp: React.createElement(Statements, { key: API.firmId }) },
        backup: { title: 'Backup & Restore', comp: React.createElement(BackupRestore, { key: API.firmId }) },
        settings: { title: 'Settings', comp: React.createElement(Settings, { key: API.firmId }) },
        updates: { title: 'Software Update', comp: React.createElement(SoftwareUpdate, { key: API.firmId, onStartUpdate: handleStartUpdate }) },
      };
      const current = pageComponents[page] || pageComponents.dashboard;

      if (!appLoaded) return React.createElement('div', { className: 'loading-screen' }, React.createElement('div', { className: 'spinner' }));
      if (!isAuthenticated) return React.createElement(Fragment, null, React.createElement(Login, { onLogin: handleLogin }), React.createElement(Toast, { toasts, removeToast }));

      return React.createElement('div', { className: 'app-layout' },
        React.createElement(Sidebar, { activePage: page, onNavigate: navigate, firmName, onLogout: authEnabled ? handleLogout : null }),
        React.createElement('main', { className: 'main-content' },
          React.createElement('header', { className: 'topbar' },
            React.createElement('div', { className: 'topbar-left' }, React.createElement('h1', { className: 'topbar-title' }, current.title)),
            React.createElement('div', { className: 'topbar-right' },
              React.createElement('div', { className: 'firm-switch' },
                React.createElement('select', { className: 'firm-switch-select', value: API.firmId || '', onChange: e => handleFirmSwitch(parseInt(e.target.value, 10)) },
                  firms.map(f => React.createElement('option', { key: f.id, value: f.id }, f.firmName || 'Unnamed Firm'))
                )
              ),
              firmName && React.createElement('span', { className: 'topbar-firm' }, firmName),
              React.createElement('div', { className: 'topbar-avatar' }, firmName ? firmName.charAt(0).toUpperCase() : 'B')
            )
          ),
          React.createElement('div', { className: 'page-content' }, current.comp)
        ),
        React.createElement(Toast, { toasts, removeToast }),
        React.createElement(UpdateProgressOverlay, { progress: updateProgress, isUpdating, onComplete: handleUpdateComplete }),
        updateCompleteBanner && React.createElement('div', { className: 'modal-overlay', style: { zIndex: 9998, backgroundColor: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
          React.createElement('div', { className: 'card', style: { maxWidth: 420, width: '90%', padding: '40px 30px', textAlign: 'center' } },
            React.createElement('div', { style: { fontSize: '3rem', marginBottom: 16 } }, '✅'),
            React.createElement('h3', { style: { marginBottom: 8, color: '#16a34a' } }, 'Update Complete!'),
            React.createElement('p', { style: { color: 'var(--text-secondary)', fontSize: '0.9rem' } }, updateCompleteBanner === true ? 'Your app has been updated successfully.' : `Updated to version ${updateCompleteBanner}`),
            React.createElement('button', { className: 'btn btn-primary', style: { marginTop: 20 }, onClick: () => { setUpdateCompleteBanner(null); window.location.reload(); } }, 'Continue')
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
