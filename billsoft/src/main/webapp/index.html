    // ─── PRODUCT SEARCH INPUT ───
    function ProductSearchInput({ products, value, onChange, onProductCreated, onEnterAfterSelect }) {
      const [text, setText] = useState('');
      const [showSuggestions, setShowSuggestions] = useState(false);
      const [highlightIdx, setHighlightIdx] = useState(-1);
      const [creating, setCreating] = useState(false);
      const containerRef = useRef(null);
      useEffect(() => {
        if (!value) { setText(''); return; }
        const p = products.find(x => String(x.id) === String(value));
        setText(p ? p.name : '');
      }, [value, products]);
      const filtered = useMemo(() => {
        if (!text.trim()) return products;
        const q = text.toLowerCase();
        return products.filter(p => p.name.toLowerCase().includes(q));
      }, [products, text]);
      const isExactMatch = useMemo(() => {
        if (!text.trim()) return false;
        return products.some(p => p.name.toLowerCase() === text.trim().toLowerCase());
      }, [products, text]);
      const selectProduct = (prod) => {
        setText(prod.name);
        onChange(String(prod.id), prod);
        setShowSuggestions(false);
        setHighlightIdx(-1);
      };
      const handleBlur = () => { setTimeout(() => { setShowSuggestions(false); setHighlightIdx(-1); }, 200); };
      const handleKeyDown = (e) => {
        if (showSuggestions && filtered.length > 0) {
          if (e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); setHighlightIdx(i => Math.min(i + 1, filtered.length - 1)); return; }
          if (e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); setHighlightIdx(i => Math.max(i - 1, 0)); return; }
        }
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); setShowSuggestions(false); return; }
        if (e.key === 'Enter') {
          e.preventDefault();
          e.stopPropagation();
          if (value) {
            if (onEnterAfterSelect) onEnterAfterSelect();
            return;
          }
          if (showSuggestions && highlightIdx >= 0 && highlightIdx < filtered.length) { selectProduct(filtered[highlightIdx]); if (onEnterAfterSelect) setTimeout(onEnterAfterSelect, 50); return; }
          const match = products.find(p => p.name.toLowerCase() === text.trim().toLowerCase());
          if (match) { selectProduct(match); if (onEnterAfterSelect) setTimeout(onEnterAfterSelect, 50); return; }
          handleCreateNew(text);
        }
      };
      const handleCreateNew = async (name) => {
        if (!name || value || isExactMatch) return;
        setCreating(true);
        try {
          const body = { name: name.trim(), price: 0, unit: 'pcs', gstPercentage: null };
          const created = await API.products.create(body);
          if (onProductCreated) onProductCreated(created);
          onChange(String(created.id), created);
          setText(created.name);
          showToast(`Product "${created.name}" created`, 'success');
          if (onEnterAfterSelect) setTimeout(onEnterAfterSelect, 100);
        } catch (e) { showToast('Failed to create product', 'error'); }
        finally { setCreating(false); }
      };
      useEffect(() => {
        const handler = (e) => { if (containerRef.current && !containerRef.current.contains(e.target)) { setShowSuggestions(false); } };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);
      return React.createElement('div', { ref: containerRef, style: { position: 'relative', minWidth: 180 } },
        React.createElement('input', {
          className: 'input', style: { width: '100%' }, placeholder: 'Search or type new...',
          value: text, onChange: e => { setText(e.target.value); setShowSuggestions(true); setHighlightIdx(-1); if (!e.target.value) onChange(''); },
          onFocus: () => setShowSuggestions(true), onBlur: handleBlur, onKeyDown: handleKeyDown
        }),
        creating && React.createElement('span', { style: { position: 'absolute', right: 8, top: 6, fontSize: '0.75rem', color: 'var(--text-secondary)' } }, '⏳'),
        showSuggestions && filtered.length > 0 && React.createElement('div', { className: 'autocomplete-dropdown', style: { position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 10, background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--radius)', maxHeight: 180, overflowY: 'auto', boxShadow: '0 4px 12px rgba(0,0,0,0.15)' } },
          filtered.map((p, i) => React.createElement('div', { key: p.id, className: 'autocomplete-item', style: { padding: '6px 10px', cursor: 'pointer', fontSize: '0.85rem', background: i === highlightIdx ? 'var(--bg-hover)' : 'transparent', borderBottom: i < filtered.length - 1 ? '1px solid var(--border-light)' : undefined }, onMouseDown: () => selectProduct(p) },
            React.createElement('div', { style: { fontWeight: 500 } }, p.name),
            React.createElement('div', { style: { fontSize: '0.75rem', color: 'var(--text-secondary)' } }, `${BillsoftUtils.formatCurrency(p.price)}${p.gstPercentage ? ` | ${p.gstPercentage}% GST` : ''}`)
          )),
          !isExactMatch && text.trim() && React.createElement('div', { style: { padding: '6px 10px', fontSize: '0.8rem', color: 'var(--text-secondary)', fontStyle: 'italic' } }, 'Press Enter to create new product')
        )
      );
    }

    // ─── SHARED INVOICE/QUOTATION FORM ───
        function InvoiceForm({ editId, isQuotationMode, onSaved, convertedFromQuotationId, activeFirmId, firms, onFirmChange, onTypeChange }) {

    function InvoiceList({ onEditInvoice }) {

      const [loading, setLoading] = useState(true);
      const [search, setSearch] = useState('');

      const [sortDir, setSortDir] = useState('desc');
      const [page, setPage] = useState(0);
      const pageSize = 50;

        setLoading(true);

      }, [page]);

        let result = [...invoices];

          const q = search.toLowerCase();
          result = result.filter(i => (i.invoiceNumber && i.invoiceNumber.toLowerCase().includes(q)) || (i.estimateNumber && i.estimateNumber.toLowerCase().includes(q)) || (i.customer && i.customer.name && i.customer.name.toLowerCase().includes(q)));

        result.sort((a, b) => {

        // If payroll month is current month and today < 27th, frozen
        if (pYear === tYear && pMonth === tMonth && todayDay < 27) return 'TOO_EARLY';
        return false;
      };

      const isFutureMonth = () => {
        const today = new Date();
        const [pYear, pMonth] = (payrollMonth || '').split('-').map(Number);
        return pYear > today.getFullYear() || (pYear === today.getFullYear() && pMonth > today.getMonth() + 1);
      };

      const getEmployeePayrollIssue = (emp) => {
        // 1) No base salary
        if (!emp.monthlyBaseSalary || emp.monthlyBaseSalary <= 0) return 'No base salary set';
        // 2) Employee joined after the payroll month
        if (emp.dateOfJoining) {
          const joiningDate = new Date(emp.dateOfJoining);
          const [pYear, pMonth] = (payrollMonth || '').split('-').map(Number);
          const payrollEnd = new Date(pYear, pMonth, 0); // last day of payroll month
          if (joiningDate > payrollEnd) return `Joined ${emp.dateOfJoining} (after this month)`;
        }
        // 3) Already processed
        if (payrollMonth && allSalaries) {
          const parts = payrollMonth.split('-');
          const targetMonthYear = parts[1] + '-' + parts[0];
          const existing = allSalaries.find(s => String(s.empId) === String(emp.id) && s.monthYear === targetMonthYear);
          if (existing) return 'ALREADY_PAID';
        }
        return null;
      };

          const results = await Promise.all(promises);
          const flattened = results.flat().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          setAllLeaves(flattened);

          // Auto-populate payrollInputs from live leave records + advance balances
          setPayrollInputs(prev => {

            employees.forEach(emp => {

              const uLeaves = Math.max(0, totalLeaves - allowed);

              const perDay = baseSal / daysInMonth;
              const leaveDed = uLeaves * perDay;
              const maxGross = Math.max(0, baseSal - leaveDed);
              // Max deductible advance this month cannot exceed net earnings before advance
              const autoAdvDeduct = Math.min(advBalance, maxGross);

              updated[emp.id] = {
                daysAbsent: totalLeaves,
                bonus: (prev[emp.id] && prev[emp.id].bonus) || 0,
                advanceDeduct: autoAdvDeduct,
                autoAdvance: (prev[emp.id] && prev[emp.id].autoAdvance !== undefined) ? prev[emp.id].autoAdvance : true,
                autoLeaves: (prev[emp.id] && prev[emp.id].autoLeaves !== undefined) ? prev[emp.id].autoLeaves : true

      // Save leave: supports date range (from-to) for multiple days at once
      const handleSaveLeaveSubmit = async (e) => {
        e.preventDefault();
        if (!leaveFormData.empId) {
          showToast('Please select a staff member', 'error');
          return;
        }
        try {
          const startDate = new Date(leaveFormData.fromDate);
          const endDate = new Date(leaveFormData.toDate);
          if (endDate < startDate) {
            showToast('"To Date" must be on or after "From Date"', 'error');
            return;
          }
          // Validation: cannot add leave for a date range > 31 days
          const daySpan = Math.floor((endDate - startDate) / 86400000) + 1;
          if (daySpan > 31) {
            showToast('Cannot log more than 31 leave days at once', 'error');
            return;
          }
          // Validation: check if employee joining date is after leave dates
          const emp = employees.find(e => String(e.id) === String(leaveFormData.empId));
          if (emp && emp.dateOfJoining) {
            const joiningDate = new Date(emp.dateOfJoining);
            if (startDate < joiningDate) {
              showToast(`Cannot log leave before joining date (${emp.dateOfJoining})`, 'error');
              return;
            }
          }
          // Validation: cannot add leave for future dates beyond today
          const today = new Date();
          today.setHours(23, 59, 59, 999);
          if (startDate > today) {
            showToast('Cannot log leave for future dates', 'error');
            return;
          }
          // Validation: block leaves for months where salary is already processed
          const blockedMonths = new Set();
          const tempDate = new Date(startDate);
          while (tempDate <= endDate) {
            const mm = String(tempDate.getMonth() + 1).padStart(2, '0');
            const yyyy = tempDate.getFullYear();
            const monthKey = `${mm}-${yyyy}`; // MM-YYYY format matching DB
            if (allSalaries.some(s => String(s.empId) === String(leaveFormData.empId) && s.monthYear === monthKey)) {
              blockedMonths.add(`${yyyy}-${mm}`);
            }
            tempDate.setDate(tempDate.getDate() + 1);

          if (blockedMonths.size > 0) {
            showToast(`Cannot add leaves — salary already processed for: ${[...blockedMonths].join(', ')}. Contact admin to reverse payroll first.`, 'error');
            return;
          }
          // Save one attendance record per day in the range
          const savePromises = [];
          const currentDate = new Date(startDate);
          while (currentDate <= endDate) {
            const dateStr = currentDate.toISOString().slice(0, 10);
            savePromises.push(
              API.employees.attendance.set(
                leaveFormData.empId,
                dateStr,
                leaveFormData.leaveType,
                leaveFormData.remarks || `${leaveFormData.leaveType} Leave`
              )
            );
            currentDate.setDate(currentDate.getDate() + 1);
          }
          await Promise.all(savePromises);
          const dayCount = savePromises.length;
          showToast(`${dayCount} leave day${dayCount > 1 ? 's' : ''} logged & approved!`, 'success');
          setShowLeaveModal(false);
          setLeaveFormData({ empId: '', fromDate: BillsoftUtils.todayStr(), toDate: BillsoftUtils.todayStr(), leaveType: 'UNPAID', remarks: '', approvedBy: 'HR Manager' });
          fetchAllAttendance();
        } catch (e) {
          showToast('Error saving leave record', 'error');
        }

      const handleProcessPayrollForEmployee = async (emp) => {
        if (processingSalaryEmpId) return; // Prevent double submit glitch
        // ── Pre-flight Validations ──
        const frozenStatus = isPayrollFrozen();
        if (frozenStatus === 'FUTURE') {
          showToast('Cannot process salary for a future month', 'error');
          return;
        }
        if (frozenStatus === 'TOO_EARLY') {
          const today = new Date();
          showToast(`Payroll is frozen until the 27th. Today is the ${today.getDate()}th — please wait.`, 'error');
          return;
        }
        const empIssue = getEmployeePayrollIssue(emp);
        if (empIssue === 'ALREADY_PAID') {
          showToast(`Salary for ${emp.name} has already been processed for ${payrollMonth}`, 'error');
          return;
        }
        if (empIssue) {
          showToast(`Cannot process salary: ${empIssue}`, 'error');
          return;
        }

        const inp = (payrollInputs[emp.id]) || { daysAbsent: 0, bonus: 0, advanceDeduct: 0 };
        const baseSal = emp.monthlyBaseSalary || 0;
        if (baseSal <= 0) {
          showToast('Cannot process salary: Base salary is ₹0', 'error');
          return;
        }

        const dAbsent = parseInt(inp.daysAbsent) || 0;
        const daysInMonth = getDaysInMonth(payrollMonth);
        if (dAbsent > daysInMonth) {
          showToast(`Absences (${dAbsent}) cannot exceed days in month (${daysInMonth})`, 'error');
          return;
        }

        const allowed = emp.allowedPaidLeavesPerMonth || 1.5;
        const uLeaves = Math.max(0, dAbsent - allowed);
        const perDay = baseSal / daysInMonth;
        
        const leaveDed = (inp.autoLeaves !== false) ? (uLeaves * perDay) : (dAbsent * perDay);
        const bon = parseFloat(inp.bonus) || 0;
        if (bon < 0) {
          showToast('Bonus amount cannot be negative', 'error');
          return;
        }
        
        const advBalance = emp.currentAdvanceBalance || 0;
        const grossEarnings = Math.max(0, baseSal - leaveDed + bon);
        const maxDeductibleAdv = Math.min(advBalance, grossEarnings);

        const deductAdvChecked = (inp.deductAdvance !== false) && advBalance > 0;
        let advD = 0;
        if (deductAdvChecked) {
          if (inp.autoAdvance) {
            advD = maxDeductibleAdv;
          } else {
            advD = (inp.advanceDeduct !== undefined && inp.advanceDeduct !== '') ? parseFloat(inp.advanceDeduct) || 0 : maxDeductibleAdv;
            advD = Math.min(advD, maxDeductibleAdv);
          }
        } else {
          advD = 0;
        }

        if (advD < 0) {
          showToast('Advance deduction cannot be negative', 'error');
          return;
        }
        if (advD > advBalance) {
          showToast(`Advance deduction (₹${advD}) exceeds outstanding balance (₹${advBalance})`, 'error');
          return;
        }

        const carryForwardAdv = Math.max(0, advBalance - advD);
        const net = Math.max(0, baseSal - leaveDed + bon - advD);

        const parts = payrollMonth.split('-');
        const monthYearStr = parts[1] + '-' + parts[0];

        // Open custom React Modal for Breakdown & Final Disbursal Confirmation
        setSalaryConfirmData({
          emp,
          baseSal,
          dAbsent,
          allowed,
          uLeaves,
          leaveDed,
          bon,
          advBalance,
          advD,
          carryForwardAdv,
          net,
          monthYearStr
        });
      };

    // ─── CREATE INVOICE / QUOTATION TABS ───
        function CreateTabView({ globalFirms, editInvoiceId, editQuotationId, convertedFromQuotationId, onClearEdit }) {
      const [tabs, setTabs] = useState(() => {
        if (editInvoiceId || editQuotationId || convertedFromQuotationId) {
          return [];
        }
        return [{ id: 1, type: 'invoice', label: 'Inv 1', firmId: API.firmId }];
      });
      const [activeTab, setActiveTab] = useState(() => {
        if (editInvoiceId || editQuotationId || convertedFromQuotationId) {
          return null;
        }
        return 1;
      });
      const tabsRef = useRef(tabs);
      tabsRef.current = tabs;
      const activeTabRef = useRef(activeTab);
      activeTabRef.current = activeTab;

      useEffect(() => {
        if (editInvoiceId) {
          const existing = tabs.find(t => t.editId === editInvoiceId && t.type === 'invoice');
          if (existing) { setActiveTab(existing.id); } 
          else {
            const newTab = { id: Date.now() + Math.random(), type: 'invoice', label: `Inv #${editInvoiceId}`, firmId: API.firmId, editId: editInvoiceId, convertedFromQuotationId };
            setTabs(prev => [...prev, newTab]);
            setActiveTab(newTab.id);
          }
          if (onClearEdit) onClearEdit();
        } else if (editQuotationId) {
          const existing = tabs.find(t => t.editId === editQuotationId && t.type === 'quotation');
          if (existing) { setActiveTab(existing.id); }
          else {
            const newTab = { id: Date.now() + Math.random(), type: 'quotation', label: `Qtn #${editQuotationId}`, firmId: API.firmId, editId: editQuotationId };
            setTabs(prev => [...prev, newTab]);
            setActiveTab(newTab.id);
          }
          if (onClearEdit) onClearEdit();
        } else if (convertedFromQuotationId) {
          const label = `Inv (Conv Qtn #${convertedFromQuotationId})`;
          const newTab = { id: Date.now() + Math.random(), type: 'invoice', label, firmId: API.firmId, convertedFromQuotationId };
          setTabs(prev => [...prev, newTab]);
          setActiveTab(newTab.id);
          if (onClearEdit) onClearEdit();
        }
      }, [editInvoiceId, editQuotationId, convertedFromQuotationId]);

      const addTab = (type) => {
        if (tabs.length >= 10) { showToast('Maximum 10 tabs allowed', 'warning'); return; }
        const count = tabs.filter(t => t.type === type).length + 1;
        const label = type === 'invoice' ? `Inv ${count}` : `Qtn ${count}`;
        const newTab = { id: Date.now() + Math.random(), type, label, firmId: API.firmId };
        setTabs(prev => [...prev, newTab]);
        setActiveTab(newTab.id);
      };

      const closeTab = (id, e) => {
        e.stopPropagation();
        const tabToClose = tabs.find(t => t.id === id);
        if (tabToClose && (tabToClose.editId || tabToClose.convertedFromQuotationId)) {
          if (onClearEdit) onClearEdit();
        }
        setTabs(prev => {
          const remaining = prev.filter(t => t.id !== id);
          if (id === activeTabRef.current) {
            if (remaining.length > 0) {
              const idx = prev.findIndex(t => t.id === id);
              const newActiveIdx = Math.min(idx, remaining.length - 1);
              setActiveTab(remaining[newActiveIdx].id);
            } else {
              setActiveTab(null);
            }
          }
          return remaining;
        });
      };

      const updateTabFirm = (id, newFirmId) => {
         setTabs(prev => prev.map(t => t.id === id ? { ...t, firmId: newFirmId } : t));
      };

      const updateTabType = (id, newType) => {
         setTabs(prev => prev.map(t => t.id === id ? { ...t, type: newType, label: (newType === 'invoice' ? 'Inv ' : 'Qtn ') + t.label.split(' ')[1] } : t));
      };

      const currentTab = tabs.find(t => t.id === activeTab);
      return React.createElement('div', null,
        React.createElement('div', { className: 'create-toolbar' },
          React.createElement('span', { className: 'create-label' }, 'Create:'),
          React.createElement('button', { className: 'btn btn-sm btn-primary', onClick: () => addTab('invoice') }, '+ Invoice'),
          React.createElement('button', { className: 'btn btn-sm btn-outline', onClick: () => addTab('quotation') }, '+ Quotation'),
          React.createElement('span', { className: 'tab-counter' }, `${tabs.length}/10`)
        ),
        tabs.length === 0 && React.createElement('div', { className: 'empty-state' },
          React.createElement('h3', null, 'No open documents'),
          React.createElement('p', null, 'Click "+ Invoice" or "+ Quotation" to start creating.')
        ),
        tabs.length > 0 && React.createElement('div', { className: 'chrome-tab-bar' },
          tabs.map(t => React.createElement('div', { key: t.id, className: `chrome-tab${activeTab === t.id ? ' active' : ''}`, onClick: () => setActiveTab(t.id) },
            React.createElement('span', { className: 'tab-icon' }, t.type === 'invoice' ? '📄' : '📋'),
            React.createElement('span', { className: 'tab-label' }, t.label),
            React.createElement('span', { className: 'tab-close', onClick: (e) => closeTab(t.id, e) }, '✕')
          ))
        ),
        currentTab && React.createElement('div', { key: currentTab.id },
          React.createElement(InvoiceForm, { 
            editId: currentTab.editId || null, 
            convertedFromQuotationId: currentTab.convertedFromQuotationId || null,
            isQuotationMode: currentTab.type === 'quotation', 
            activeFirmId: currentTab.firmId,
            firms: globalFirms,
            onFirmChange: (newFirmId) => updateTabFirm(currentTab.id, newFirmId),
            onTypeChange: (newType) => updateTabType(currentTab.id, newType),
            onSaved: () => { 
              showToast(currentTab.type === 'invoice' ? 'Invoice created!' : 'Quotation created!', 'success');
              closeTab(currentTab.id, { stopPropagation: () => {} });
              if (onClearEdit) onClearEdit();
            } 
          })
        )
      );
    }

    // ─── MAIN APP ───
    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(localStorage.getItem('isAuthenticated') === 'true');
      const [reminders, setReminders] = useState([]);
      const [notes, setNotes] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [messages, setMessages] = useState([]);
      const [appLoaded, setAppLoaded] = useState(false);
      const [authEnabled, setAuthEnabled] = useState(false);
      const [page, setPage] = useState('dashboard');
      const [editInvoiceId, setEditInvoiceId] = useState(null);
      const [editQuotationId, setEditQuotationId] = useState(null);
      const [convertedFromQuotationId, setConvertedFromQuotationId] = useState(null);
      const [firmName, setFirmName] = useState('');
      const [firms, setFirms] = useState([]);
      const [toasts, setToasts] = useState([]);
      const [newMsgPopup, setNewMsgPopup] = useState(null);
      const [firmLoadKey, setFirmLoadKey] = useState(0);

      const [licenseStatus, setLicenseStatus] = useState('trial');
      const [trialDaysRemaining, setTrialDaysRemaining] = useState(30);
      const [firstTimeSetup, setFirstTimeSetup] = useState(false);

      const initApp = async () => {
        try {
          const list = await API.firm.list().catch(() => []);
          const hasFirmInDb = list && list.length > 0;

          const lic = await API.license.status().catch(() => ({ hasFirm: hasFirmInDb, status: 'trial', trialDaysRemaining: 30 }));
          setLicenseStatus(lic.status || 'trial');
          setTrialDaysRemaining(lic.trialDaysRemaining != null ? lic.trialDaysRemaining : 30);
          
          if (!hasFirmInDb || !lic.hasFirm) {
            setFirstTimeSetup(true);
            setAppLoaded(true);
            return;
          } else {
            setFirstTimeSetup(false);
          }

          if (list && list.length) {
            API.firmId = list[0].id;
            setFirmName(list[0].firmName || '');
            setFirms(list);
          }

          const res = await API.auth.status().catch(() => ({ authEnabled: false }));
          if (res && typeof res.authEnabled === 'boolean') {
            setAuthEnabled(res.authEnabled);
            if (!res.authEnabled) setIsAuthenticated(true);
          } else {
            setIsAuthenticated(true);
          }
        } catch (_) {
          setIsAuthenticated(true);
        } finally {
          setAppLoaded(true);
        }
      };

      useEffect(() => {
        initApp();
      }, [firmLoadKey]);

      const handleLogin = (firmId) => { setIsAuthenticated(true); localStorage.setItem('isAuthenticated', 'true'); if (firmId) API.firmId = firmId; setFirmLoadKey(k => k + 1); };
      const handleLogout = () => { setIsAuthenticated(false); localStorage.removeItem('isAuthenticated'); API.firmId = null; setFirmName(''); setFirms([]); window.showToast('Logged out successfully', 'success'); };
      window.showToast = (message, type = 'info') => { const id = BillsoftUtils.generateId(); setToasts(t => [...t, { id, message, type }]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4000); };
      const removeToast = (id) => setToasts(t => t.filter(x => x.id !== id));
      const loadFirms = () => {
        API.firm.list().then(list => {
          setFirms(list);
          const savedId = API.firmId;
          if (list.length === 0) return;
          if (!savedId) API.firmId = list[0].id;
          const currentId = API.firmId;
          if (currentId) { const firm = list.find(f => f.id === currentId); if (firm && firm.firmName) setFirmName(firm.firmName); }
        }).catch(() => {});
      };
      useEffect(() => { loadFirms(); }, [firmLoadKey]);
      // Load reminders, notes, and expenses after firm is ready
      useEffect(() => {
        if (API.firmId) {
          if (API.reminders && typeof API.reminders.list === 'function') {
            API.reminders.list().then(setReminders).catch(() => {});
          }
          if (API.notes && typeof API.notes.listByFirm === 'function') {
            API.notes.listByFirm(API.firmId).then(setNotes).catch(() => {});
          }
          if (API.expenses && typeof API.expenses.listByFirm === 'function') {
            API.expenses.listByFirm(API.firmId).then(setExpenses).catch(() => {});
          }
        }
      }, [API.firmId]);
      const lastSeenMsgIdRef = useRef(null);

      const checkNewMessages = () => {
        if (!API.firmId) return;
        API.messages.list().then(list => {
          if (list && list.length > 0) {
            setMessages(list);
            const maxId = Math.max(...list.map(m => m.id));
            if (lastSeenMsgIdRef.current !== null && lastSeenMsgIdRef.current > 0) {
              const newMsgs = list.filter(m => m.id > lastSeenMsgIdRef.current);
              if (newMsgs.length > 0) {
                showToast(`New message: ${newMsgs[0].subject}`, 'info');
              }
            }
            lastSeenMsgIdRef.current = maxId;
          }
        }).catch(() => {});
      };

      useEffect(() => {
        if (API.firmId) {
          API.messages.list().then(list => {
            setMessages(list);
            if (list && list.length > 0) {
              lastSeenMsgIdRef.current = Math.max(...list.map(m => m.id));
            } else {
              lastSeenMsgIdRef.current = 0;
            }
          }).catch(() => {});
        }
      }, [API.firmId]);

      useEffect(() => {
        const timer = setInterval(() => {
          checkNewMessages();
        }, 5000);
        return () => clearInterval(timer);
      }, [API.firmId]);
      const refreshFirm = () => {
        const currentId = API.firmId;
        if (currentId) { API.firm.get(currentId).then(f => { if (f && f.firmName) setFirmName(f.firmName); API.firm.list().then(list => setFirms(list)).catch(() => {}); }).catch(() => {}); }
      };
      const handleFirmSwitch = (firmId) => {
        const prevId = API.firmId;
        if (firmId === prevId) return;
        API.firmId = firmId;
        API.firm.get(firmId).then(f => { if (f && f.firmName) setFirmName(f.firmName); }).catch(() => {});
        API.firm.list().then(list => setFirms(list)).catch(() => {});
        showToast('Switched firm', 'success');
      };
      // Handle browser back button (popstate)
      useEffect(() => {
        const handlePopState = (event) => {
          if (event.state && event.state.page) {
            setPage(event.state.page);
            if (event.state.page !== 'new-invoice') setEditInvoiceId(null);
            if (event.state.page !== 'new-quotation') { setEditQuotationId(null); setConvertedFromQuotationId(null); }
          } else {
            setPage('dashboard');
          }
        };
        window.addEventListener('popstate', handlePopState);
        // Push initial state
        window.history.replaceState({ page: 'dashboard' }, '', '');
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (document.querySelector('.modal-overlay')) return;
            if (page !== 'dashboard') {
              window.history.back();
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [page]);

      const navigate = (p) => {
        setPage(p);
        window.history.pushState({ page: p }, '', '');
        if (p !== 'new-invoice') setEditInvoiceId(null);
        if (p !== 'new-quotation') { setEditQuotationId(null); setConvertedFromQuotationId(null); }
      };
      const handleEditInvoice = (id) => { setEditInvoiceId(id); setEditQuotationId(null); setConvertedFromQuotationId(null); setPage('invoices'); };
      const handleMarkReminderDone = (id) => {
        API.reminders.markDone(id).then((updated) => {
          setReminders(prev => prev.map(r => r.id === id ? updated : r));
          showToast('Marked as done', 'success');
        }).catch(() => {
          showToast('Failed to mark as done', 'error');
        });
      };
      const handleCreateReminder = (data) => {
        return API.reminders.create({ ...data, type: 'reminder', status: 'TODO', progress: 0 }).then(newRem => {
          setReminders(prev => [...prev, newRem]);
          showToast('Reminder created successfully', 'success');
        }).catch(e => {
          showToast('Failed to create reminder', 'error');
        });
      };
      const handleCreateTask = (data) => {
        return API.reminders.create({ ...data, type: 'task' }).then(newTask => {
          setReminders(prev => [...prev, newTask]);
          showToast('Task created successfully', 'success');
        }).catch(e => {
          showToast('Failed to create task', 'error');
        });
      };
      const handleUpdateReminder = (id, data) => {
        return API.reminders.update(id, data).then(updated => {
          setReminders(prev => prev.map(r => r.id === id ? updated : r));
          showToast('Updated successfully', 'success');
        }).catch(e => {
          showToast('Failed to update', 'error');
        });
      };
      const handleDeleteReminder = (id) => {
        return API.reminders.delete(id).then(() => {
          setReminders(prev => prev.filter(r => r.id !== id));
          showToast('Deleted successfully', 'success');
        }).catch(e => {
          showToast('Failed to delete', 'error');
        });
      };

      const handleCreateNote = (data) => {
        return API.notes.create(data).then(newNote => {
          setNotes(prev => [...prev, newNote]);
          showToast('Note created successfully', 'success');
        }).catch(e => {
          showToast('Failed to create note', 'error');
        });
      };
      const handleUpdateNote = (id, data) => {
        return API.notes.update(id, data).then(updated => {
          setNotes(prev => prev.map(n => n.id === id ? updated : n));
          showToast('Note updated successfully', 'success');
        }).catch(e => {
          showToast('Failed to update note', 'error');
        });
      };
      const handleDeleteNote = (id) => {
        return API.notes.delete(id).then(() => {
          setNotes(prev => prev.filter(n => n.id !== id));
          showToast('Note deleted successfully', 'success');
        }).catch(e => {
          showToast('Failed to delete note', 'error');
        });
      };

      const handleCreateExpense = (data) => {
        return API.expenses.create(data).then(newExp => {
          setExpenses(prev => [newExp, ...prev]);
          showToast('Expense recorded successfully', 'success');
        }).catch(e => {
          showToast('Failed to record expense', 'error');
        });
      };
      const handleUpdateExpense = (id, data) => {
        return API.expenses.update(id, data).then(updated => {
          setExpenses(prev => prev.map(e => e.id === id ? updated : e));
          showToast('Expense updated successfully', 'success');
        }).catch(e => {
          showToast('Failed to update expense', 'error');
        });
      };
      const handleDeleteExpense = (id) => {
        return API.expenses.delete(id).then(() => {
          setExpenses(prev => prev.filter(e => e.id !== id));
          showToast('Expense deleted successfully', 'success');
        }).catch(e => {
          showToast('Failed to delete expense', 'error');
        });
      };

      const handleEditQuotation = (id) => { setEditQuotationId(id); setEditInvoiceId(null); setConvertedFromQuotationId(null); setPage('invoices'); };
      const handleConvertToInvoice = (quotation) => {
        setEditInvoiceId(null);
        setEditQuotationId(null);
        setConvertedFromQuotationId(quotation.id);
        setPage('invoices');

      const handleSaved = () => {
        setEditInvoiceId(null);
        setEditQuotationId(null);
        setConvertedFromQuotationId(null);
        setPage('invoices');
      };
      const handleQuotationSaved = () => {
        setEditInvoiceId(null);
        setEditQuotationId(null);
        setConvertedFromQuotationId(null);
        setPage('invoices');
      };
      const handleFirmChanged = () => { refreshFirm(); setFirmLoadKey(k => k + 1); };
      const handleSendMessage = (data) => {
        API.messages.create(data).then(newMsg => {
          setMessages(prev => [newMsg, ...prev]);
          if (lastSeenMsgIdRef.current === null || newMsg.id > lastSeenMsgIdRef.current) {
            lastSeenMsgIdRef.current = newMsg.id;
          }
          showToast('Message sent successfully', 'success');
        }).catch(() => {
          showToast('Failed to send message', 'error');
        });
      };
      const handleMarkMessageRead = (id) => {
        API.messages.markRead(id).then(updated => {
          setMessages(prev => prev.map(m => m.id === id ? { ...m, isRead: true, read: true } : m));
        }).catch(() => {});
      };
      const handleDeleteMessage = (id) => {
        return API.messages.delete(id).then(() => {
          setMessages(prev => prev.filter(m => m.id !== id));
          showToast('Message dismissed', 'success');
        }).catch(() => {
          showToast('Failed to dismiss message', 'error');
        });
      };

      const [isUpdating, setIsUpdating] = useState(false);
      const [updateCompleteBanner, setUpdateCompleteBanner] = useState(null);
      useEffect(() => {
        API._json('/api/system/check-update-complete').then(res => { if (res && res.justUpdated) setUpdateCompleteBanner(res.updatedVersion || true); }).catch(() => {});
      }, []);
      const [updateProgress, setUpdateProgress] = useState(null);
      const updatePollRef = useRef(null);
      const restartPollingRef = useRef(null);

      const startRestartPolling = (latestVer) => {
        if (restartPollingRef.current) return;
        let attempts = 0;
        const maxAttempts = 60;
        restartPollingRef.current = setInterval(async () => {
          attempts++;
          try {
            const res = await fetch(API.BASE_URL + '/api/health', { cache: 'no-cache' });
            if (res.ok) {
              clearInterval(restartPollingRef.current);
              restartPollingRef.current = null;
              setUpdateProgress({ status: 'complete', percent: 100, message: 'Update installed successfully! Reloading...', latestVersion: latestVer || '' });
              setTimeout(() => {
                window.location.reload();
              }, 1200);
            }
          } catch (e) {
            setUpdateProgress(prev => ({
              ...(prev || {}),
              status: 'restarting',
              percent: 100,
              message: `Applying update and restarting RupeeCRM... (${attempts}s)`,
              latestVersion: latestVer || (prev ? prev.latestVersion : '')
            }));
            if (attempts >= maxAttempts) {
              clearInterval(restartPollingRef.current);
              restartPollingRef.current = null;
              setUpdateProgress({
                status: 'error',
                percent: 0,
                message: 'Restart is taking longer than usual. Please refresh the page or restart RupeeCRM.',
                latestVersion: latestVer || ''
              });
            }
          }
        }, 1000);
      };

      const connectUpdateProgressSSE = (latestVersion) => {
        if (updatePollRef.current) { updatePollRef.current.close(); updatePollRef.current = null; }
        const source = new EventSource(API.BASE_URL + '/api/system/update-progress');
        updatePollRef.current = source;
        source.addEventListener('progress', e => {
          try {
            const data = JSON.parse(e.data);
            setUpdateProgress(data);
            if (data.status === 'restarting' || data.status === 'complete') {
              source.close();
              updatePollRef.current = null;
              startRestartPolling(data.latestVersion || latestVersion);
            } else if (data.status === 'error') {
              source.close();
              updatePollRef.current = null;
            }
          } catch (err) {}
        });
        source.onerror = () => {
          setUpdateProgress(prev => {
            if (prev && (prev.status === 'downloading' || prev.status === 'installing' || prev.status === 'restarting')) {
              startRestartPolling(prev.latestVersion || latestVersion);
              return { ...prev, status: 'restarting', message: 'Restarting RupeeCRM service...', percent: 100 };
            }
            return prev;
          });
        };
        return new Promise(resolve => setTimeout(resolve, 500));
      };

      const handleStartUpdate = async (latestVersion) => {
        setIsUpdating(true);
        setUpdateProgress({ status: 'downloading', percent: 0, message: 'Starting download...', latestVersion: latestVersion || '' });
        await connectUpdateProgressSSE(latestVersion);
        try { await API.system.applyUpdate(); } catch (e) { setUpdateProgress({ status: 'error', percent: 0, message: 'Update failed: ' + (e.message || 'Unknown error'), latestVersion: latestVersion || '' }); }
      };
      const handleUpdateComplete = () => {
        setIsUpdating(false);
        setUpdateProgress(null);
        if (updatePollRef.current) { updatePollRef.current.close(); updatePollRef.current = null; }
        if (restartPollingRef.current) { clearInterval(restartPollingRef.current); restartPollingRef.current = null; }
      };

      const [invoiceSubTab, setInvoiceSubTab] = useState('invoices');

      const handleQuickCreate = () => {
        setEditInvoiceId(null);
        setEditQuotationId(null);
        setConvertedFromQuotationId(null);
        setInvoiceSubTab('create');
        setPage('invoices');
      };

      const pageComponents = {
        dashboard: { title: 'Dashboard', comp: React.createElement(Dashboard, {
          key: API.firmId,
          onStartUpdate: handleStartUpdate,
          messages,
          reminders,
          notes,
          expenses,
          firms,
          onMarkDone: handleMarkReminderDone,
          onUpdateReminder: handleUpdateReminder,
          onMarkMessageRead: handleMarkMessageRead,
          onDeleteMessage: handleDeleteMessage,
          onCreateReminder: handleCreateReminder,
          onCreateTask: handleCreateTask,
          onCreateNote: handleCreateNote,
          onCreateExpense: handleCreateExpense
        }) },
        invoices: { title: 'Invoices & Quotes', comp: React.createElement(InvoicesQuotesHub, {
          key: API.firmId,
          subTab: invoiceSubTab,
          onSubTabChange: setInvoiceSubTab,
          editInvoiceId,
          editQuotationId,
          convertedFromQuotationId,
          onEditInvoice: handleEditInvoice,
          onEditQuotation: handleEditQuotation,
          onConvertToInvoice: handleConvertToInvoice,
          onClearEdit: () => { setEditInvoiceId(null); setEditQuotationId(null); setConvertedFromQuotationId(null); },
          firms
        }) },
        firm: { title: 'Firm', comp: React.createElement(FirmPage, { onFirmChanged: handleFirmChanged, onEditInvoice: handleEditInvoice, onEditQuotation: handleEditQuotation }) },
        planner: { title: 'Planner', comp: React.createElement(PlannerPage, {
          reminders,
          notes,
          expenses,
          firms,
          onMarkDone: handleMarkReminderDone,
          onUpdateReminder: handleUpdateReminder,
          onDeleteReminder: handleDeleteReminder,
          onCreateReminder: handleCreateReminder,
          onCreateTask: handleCreateTask,
          onCreateNote: handleCreateNote,
          onUpdateNote: handleUpdateNote,
          onDeleteNote: handleDeleteNote,
          onCreateExpense: handleCreateExpense,
          onUpdateExpense: handleUpdateExpense,
          onDeleteExpense: handleDeleteExpense
        }) },
        inbox: { title: 'Inbox', comp: React.createElement(InboxPage, { messages: messages, onSendMessage: handleSendMessage, onMarkRead: handleMarkMessageRead, onDeleteMessage: handleDeleteMessage, reminders, onMarkDone: handleMarkReminderDone, onUpdateReminder: handleUpdateReminder }) },
        hr: { title: 'HR Management', comp: React.createElement(HRManager, { key: API.firmId }) },
        employees: { title: 'HR Management', comp: React.createElement(HRManager, { key: API.firmId }) },
        statements: { title: 'Statements', comp: React.createElement(Statements, { key: API.firmId, globalFirms: firms }) },
        settings: { title: 'Settings', comp: React.createElement(SettingsHub, { onFirmChanged: handleFirmChanged, onStartUpdate: handleStartUpdate }) },
      };
      const current = pageComponents[page] || pageComponents.dashboard;

      if (!appLoaded) return React.createElement('div', { className: 'loading-screen' }, React.createElement('div', { className: 'spinner' }));
      if (firstTimeSetup) return React.createElement(Fragment, null, React.createElement(FirstTimeSetupComponent, { onComplete: () => { setFirstTimeSetup(false); setFirmLoadKey(k => k + 1); } }), React.createElement(Toast, { toasts, removeToast }));
      if (licenseStatus === 'expired') return React.createElement(Fragment, null, React.createElement(TrialExpiredComponent, { onComplete: () => { setLicenseStatus('activated'); } }), React.createElement(Toast, { toasts, removeToast }));
      if (!isAuthenticated) return React.createElement(Fragment, null, React.createElement(Login, { onLogin: handleLogin }), React.createElement(Toast, { toasts, removeToast }));

      return React.createElement('div', { className: 'app-layout' },
        React.createElement('div', { className: 'sidebar-container' },
          React.createElement(Sidebar, { activePage: page, onNavigate: navigate, firmName, onLogout: authEnabled ? handleLogout : null, onQuickCreate: handleQuickCreate })
        ),
        React.createElement('main', { className: 'main-content' },
          React.createElement('header', { className: 'topbar' },
            React.createElement('div', { className: 'topbar-left' }, React.createElement('h1', { className: 'topbar-title' }, current.title)),
            React.createElement('div', { className: 'topbar-right' },
              licenseStatus === 'trial' ? React.createElement('div', { style: { background: 'rgba(245, 158, 11, 0.15)', border: '1px solid rgba(245, 158, 11, 0.3)', color: '#d97706', padding: '6px 12px', borderRadius: 6, fontSize: '0.8rem', fontWeight: 600, marginRight: 15, display: 'flex', alignItems: 'center', gap: 6 } }, `⏳ Trial Mode: ${trialDaysRemaining} days remaining`) :
              licenseStatus === 'activated' ? React.createElement('div', { style: { background: 'linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15))', border: '1px solid rgba(168, 85, 247, 0.35)', color: '#8b5cf6', padding: '6px 12px', borderRadius: 6, fontSize: '0.8rem', fontWeight: 700, marginRight: 15, display: 'flex', alignItems: 'center', gap: 5, letterSpacing: '0.04em' } }, '👑 PREMIUM') : null,
              (!editInvoiceId && !editQuotationId && !convertedFromQuotationId) && React.createElement('div', { className: 'firm-switch' },
                React.createElement('select', { className: 'firm-switch-select', value: API.firmId || '', onChange: e => handleFirmSwitch(parseInt(e.target.value, 10)) },
                  firms.map(f => React.createElement('option', { key: f.id, value: f.id }, f.firmName || 'Unnamed Firm'))
                )
              ),
              (!editInvoiceId && !editQuotationId && !convertedFromQuotationId) && firmName && React.createElement('span', { className: 'topbar-firm' }, firmName),
              React.createElement('div', { className: 'topbar-avatar' }, firmName ? firmName.charAt(0).toUpperCase() : 'B')
            )
          ),
          React.createElement('div', { className: 'page-content' }, current.comp)
        ),
        React.createElement(Toast, { toasts, removeToast }),
        React.createElement(UpdateProgressOverlay, { progress: updateProgress, isUpdating, onComplete: handleUpdateComplete }),
        updateCompleteBanner && React.createElement('div', { className: 'modal-overlay', style: { zIndex: 9998, backgroundColor: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
          React.createElement('div', { className: 'card', style: { maxWidth: 420, width: '90%', padding: '40px 30px', textAlign: 'center' } },
            React.createElement('div', { style: { fontSize: '3rem', marginBottom: 16 } }, '✅'),
            React.createElement('h3', { style: { marginBottom: 8, color: '#16a34a' } }, 'Update Complete!'),
            React.createElement('p', { style: { color: 'var(--text-secondary)', fontSize: '0.9rem' } }, updateCompleteBanner === true ? 'Your app has been updated successfully.' : `Updated to version ${updateCompleteBanner}`),
            React.createElement('button', { className: 'btn btn-primary', style: { marginTop: 20 }, onClick: () => { setUpdateCompleteBanner(null); window.location.reload(); } }, 'Continue')
          )
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('Unhandled UI Exception caught by ErrorBoundary:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return React.createElement('div', {
            style: {
              minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
              backgroundColor: '#0f172a', color: '#fff', fontFamily: "'Inter', sans-serif", padding: 24
            }
          },
            React.createElement('div', {
              style: {
                maxWidth: 480, width: '100%', padding: '36px 30px', textAlign: 'center',
                background: 'rgba(255,255,255,0.06)', borderRadius: 16, border: '1px solid rgba(255,255,255,0.1)'
              }
            },
              React.createElement('div', { style: { fontSize: '3rem', marginBottom: 14 } }, '⚠️'),
              React.createElement('h2', { style: { fontSize: '1.4rem', fontWeight: 700, margin: '0 0 8px', color: '#f87171' } }, 'Something went wrong'),
              React.createElement('p', { style: { color: 'rgba(255,255,255,0.65)', fontSize: '0.88rem', margin: '0 0 20px', lineHeight: 1.5 } },
                'An unexpected error occurred in the application view. You can reload to restore normal operation.'
              ),
              this.state.error && React.createElement('pre', {
                style: {
                  background: 'rgba(0,0,0,0.4)', padding: '10px 14px', borderRadius: 8,
                  fontSize: '0.75rem', color: '#fca5a5', textAlign: 'left', overflowX: 'auto',
                  maxHeight: 120, marginBottom: 20
                }
              }, String(this.state.error.message || this.state.error)),
              React.createElement('button', {
                className: 'btn btn-primary',
                style: { padding: '10px 24px', borderRadius: 8, fontWeight: 600 },
                onClick: () => { window.location.reload(); }
              }, '🔄 Reload Application')
            )
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(ErrorBoundary, null, React.createElement(App))
    );
  </script>
